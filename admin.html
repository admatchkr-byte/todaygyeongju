<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘, 경주 - 관리자 페이지</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏯%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #faf6f0;
      --card: #ffffff;
      --accent: #8c5230;
      --accent-hover: #703f23;
      --border: #e6dccf;
      --text: #2f261f;
      --muted: #7a6c5d;
    }
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { margin: 0; font-size: 22px; color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
    .hidden { display: none !important; }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; color: var(--muted); }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; background: #fffdfb;
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    .btn-row button { margin-top: 0; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: #eee6dc; color: var(--text); margin-top: 0; }
    button.edit { background: #6b5b4d; padding: 6px 12px; font-size: 12px; margin-top: 0; }
    button.danger { background: #c94a4a; padding: 6px 12px; font-size: 12px; margin-top: 0; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { margin-top: 0; background: #eee6dc; color: var(--text); }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .item:last-child { border-bottom: none; }
    .item-info { flex: 1; }
    .badge {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: #f3e8dc; color: var(--accent); font-weight: 700; margin-right: 6px;
    }
    .badge-expired {
      background: #fde8e8; color: #b91c1c;
    }
    .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .msg { font-size: 13px; margin-top: 10px; color: var(--accent); font-weight: 600; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>오늘, 경주 관리자</h1>
      <button id="logout-btn" class="secondary hidden">로그아웃</button>
    </div>

    <!-- 로그인 화면 -->
    <div id="login-section" class="card">
      <h2>관리자 로그인</h2>
      <form id="login-form">
        <label>이메일</label>
        <input type="email" id="login-email" required placeholder="admin@example.com" />
        <label>비밀번호</label>
        <input type="password" id="login-password" required placeholder="비밀번호 입력" />
        <button type="submit">로그인</button>
        <div id="login-msg" class="msg"></div>
      </form>
    </div>

    <!-- 관리자 대시보드 -->
    <div id="admin-section" class="hidden">
      <div class="tabs">
        <button class="tab-btn active" data-tab="events-tab">행사 관리</button>
        <button class="tab-btn" data-tab="coupons-tab">쿠폰 관리</button>
      </div>

      <!-- 행사 관리 탭 -->
      <div id="events-tab">
        <div class="card" id="event-form-card">
          <h2 id="ev-form-title">새 행사 등록</h2>
          <form id="event-form">
            <div class="row">
              <div>
                <label>카테고리</label>
                <select id="ev-category">
                  <option value="축제">축제</option>
                  <option value="공연">공연</option>
                  <option value="전시">전시</option>
                  <option value="팝업·플리마켓">팝업·플리마켓</option>
                </select>
              </div>
              <div>
                <label>행사명 *</label>
                <input type="text" id="ev-title" required placeholder="예: 황리단길 야간 플리마켓" />
              </div>
            </div>
            <div class="row">
              <div>
                <label>시작일</label>
                <input type="date" id="ev-start" />
              </div>
              <div>
                <label>종료일</label>
                <input type="date" id="ev-end" />
              </div>
            </div>
            <label>장소</label>
            <input type="text" id="ev-location" placeholder="예: 경주시 황남동 일대" />
            <label>설명</label>
            <textarea id="ev-desc" placeholder="행사 시간, 입장료 등 간단한 안내"></textarea>
            <label>행사 포스터 / 사진 업로드 (선택)</label>
            <input type="file" id="ev-image" accept="image/*" />
            <div id="ev-image-hint" class="hint hidden"></div>
            <div class="btn-row">
              <button type="submit" id="ev-submit-btn">행사 등록하기</button>
              <button type="button" id="ev-cancel-btn" class="secondary hidden">수정 취소</button>
            </div>
            <div id="ev-msg" class="msg"></div>
          </form>
        </div>

        <div class="card">
          <h2>등록된 행사 목록</h2>
          <div id="events-list">불러오는 중...</div>
        </div>
      </div>

      <!-- 쿠폰 관리 탭 -->
      <div id="coupons-tab" class="hidden">
        <div class="card" id="coupon-form-card">
          <h2 id="cp-form-title">새 쿠폰 등록</h2>
          <form id="coupon-form">
            <div class="row">
              <div>
                <label>매장명 *</label>
                <input type="text" id="cp-store" required placeholder="예: 황남비빔밥" />
              </div>
              <div>
                <label>할인 혜택 *</label>
                <input type="text" id="cp-discount" required placeholder="예: 전 메뉴 10% 할인" />
              </div>
            </div>
            <div class="row">
              <div>
                <label>한정 수량 선택 *</label>
                <select id="cp-qty-preset">
                  <option value="10">선착순 10개</option>
                  <option value="30">선착순 30개</option>
                  <option value="50" selected>선착순 50개</option>
                  <option value="100">선착순 100개</option>
                  <option value="custom">직접 입력</option>
                </select>
              </div>
              <div>
                <label>수량 직접 확인 / 입력 (개)</label>
                <input type="number" id="cp-qty" min="1" value="50" required />
              </div>
            </div>
            <label>유효기간 마감일 (비워두면 상시 사용 가능)</label>
            <input type="date" id="cp-valid-until" />
            <label>사용 조건 / 설명</label>
            <textarea id="cp-desc" placeholder="예: 결제 시 쿠폰 이미지 제시, 평일만 적용 등"></textarea>
            <label>쿠폰 이미지 업로드</label>
            <input type="file" id="cp-image" accept="image/*" />
            <div id="cp-image-hint" class="hint hidden"></div>
            <div class="btn-row">
              <button type="submit" id="cp-submit-btn">쿠폰 등록하기</button>
              <button type="button" id="cp-cancel-btn" class="secondary hidden">수정 취소</button>
            </div>
            <div id="cp-msg" class="msg"></div>
          </form>
        </div>

        <div class="card">
          <h2>등록된 쿠폰 목록</h2>
          <div id="coupons-list">불러오는 중...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cgwqpgmfyryegykvggyp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7nrf_n8X346CPb-5LWZycA_P3aVc--Q';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let eventsCache = [];
    let editingEventId = null;
    let editingEventImageUrl = '';

    let couponsCache = [];
    let editingCouponId = null;
    let editingImageUrl = '';

    const escapeHtml = (str = '') =>
      String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));

    const getTodayKst = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('events-tab').classList.toggle('hidden', btn.dataset.tab !== 'events-tab');
        document.getElementById('coupons-tab').classList.toggle('hidden', btn.dataset.tab !== 'coupons-tab');
      });
    });

    // 한정 수량 선택 연동
    const qtyPreset = document.getElementById('cp-qty-preset');
    const qtyInput = document.getElementById('cp-qty');
    qtyPreset.addEventListener('change', () => {
      if (qtyPreset.value !== 'custom') {
        qtyInput.value = qtyPreset.value;
      } else {
        qtyInput.focus();
      }
    });
    qtyInput.addEventListener('input', () => {
      qtyPreset.value = ['10', '30', '50', '100'].includes(qtyInput.value) ? qtyInput.value : 'custom';
    });

    // 행사 폼 초기화
    function resetEventForm() {
      editingEventId = null;
      editingEventImageUrl = '';
      document.getElementById('event-form').reset();
      document.getElementById('ev-form-title').textContent = '새 행사 등록';
      document.getElementById('ev-submit-btn').textContent = '행사 등록하기';
      document.getElementById('ev-cancel-btn').classList.add('hidden');
      document.getElementById('ev-image-hint').classList.add('hidden');
      document.getElementById('ev-image-hint').textContent = '';
    }

    document.getElementById('ev-cancel-btn').addEventListener('click', () => {
      resetEventForm();
      document.getElementById('ev-msg').textContent = '';
    });

    // 쿠폰 폼 초기화
    function resetCouponForm() {
      editingCouponId = null;
      editingImageUrl = '';
      document.getElementById('coupon-form').reset();
      qtyPreset.value = '50';
      qtyInput.value = '50';
      document.getElementById('cp-form-title').textContent = '새 쿠폰 등록';
      document.getElementById('cp-submit-btn').textContent = '쿠폰 등록하기';
      document.getElementById('cp-cancel-btn').classList.add('hidden');
      document.getElementById('cp-image-hint').classList.add('hidden');
      document.getElementById('cp-image-hint').textContent = '';
    }

    document.getElementById('cp-cancel-btn').addEventListener('click', () => {
      resetCouponForm();
      document.getElementById('cp-msg').textContent = '';
    });

    // 로그인 상태 확인
    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      const loggedIn = !!session;
      document.getElementById('login-section').classList.toggle('hidden', loggedIn);
      document.getElementById('admin-section').classList.toggle('hidden', !loggedIn);
      document.getElementById('logout-btn').classList.toggle('hidden', !loggedIn);
      if (loggedIn) {
        loadEvents();
        loadCoupons();
      }
    }

    // 로그인
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('login-msg').textContent = '로그인 실패: ' + error.message;
      } else {
        document.getElementById('login-msg').textContent = '';
        checkAuth();
      }
    });

    // 로그아웃
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      checkAuth();
    });

    // 행사 불러오기
    async function loadEvents() {
      const { data, error } = await sb.from('events').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('events-list');
      if (error) return (list.textContent = '불러오기 실패: ' + error.message);
      if (!data.length) {
        eventsCache = [];
        return (list.textContent = '등록된 행사가 없습니다.');
      }

      eventsCache = data;
      list.innerHTML = data.map(ev => `
        <div class="item">
          ${ev.image_url ? `<img class="thumb" src="${escapeHtml(ev.image_url)}" alt="">` : ''}
          <div class="item-info">
            <div><span class="badge">${escapeHtml(ev.category)}</span><strong>${escapeHtml(ev.title)}</strong></div>
            <div style="font-size:13px;color:#7a6c5d;margin-top:4px;">
              ${escapeHtml(ev.start_date || '미정')} ~ ${escapeHtml(ev.end_date || '미정')} · ${escapeHtml(ev.location || '장소 미정')}
            </div>
          </div>
          <div class="actions">
            <button class="edit" onclick="editEvent(${ev.id})">수정</button>
            <button class="danger" onclick="deleteEvent(${ev.id})">삭제</button>
          </div>
        </div>
      `).join('');
    }

    // 행사 수정 시작
    window.editEvent = (id) => {
      const ev = eventsCache.find(item => item.id === id);
      if (!ev) return;

      editingEventId = ev.id;
      editingEventImageUrl = ev.image_url || '';

      document.getElementById('ev-category').value = ev.category || '축제';
      document.getElementById('ev-title').value = ev.title || '';
      document.getElementById('ev-start').value = ev.start_date || '';
      document.getElementById('ev-end').value = ev.end_date || '';
      document.getElementById('ev-location').value = ev.location || '';
      document.getElementById('ev-desc').value = ev.description || '';
      document.getElementById('ev-image').value = '';

      document.getElementById('ev-form-title').textContent = `행사 수정 (${ev.title})`;
      document.getElementById('ev-submit-btn').textContent = '수정 저장하기';
      document.getElementById('ev-cancel-btn').classList.remove('hidden');

      const hint = document.getElementById('ev-image-hint');
      hint.textContent = editingEventImageUrl
        ? '새 파일을 선택하지 않으면 기존 행사 이미지가 그대로 유지됩니다.'
        : '현재 등록된 이미지가 없습니다. 필요하면 이미지를 선택해 주세요.';
      hint.classList.remove('hidden');

      document.getElementById('ev-msg').textContent = '';
      document.getElementById('event-form-card').scrollIntoView({ behavior: 'smooth' });
    };

    // 행사 등록 및 수정 저장
    document.getElementById('event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('ev-msg');
      msg.textContent = '저장 중...';

      let imageUrl = editingEventId ? editingEventImageUrl : '';
      const file = document.getElementById('ev-image').files[0];

      if (file) {
        const ext = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await sb.storage.from('events').upload(fileName, file);
        if (upErr) return (msg.textContent = '이미지 업로드 실패: ' + upErr.message);

        const { data: urlData } = sb.storage.from('events').getPublicUrl(fileName);
        imageUrl = urlData.publicUrl;
      }

      const payload = {
        category: document.getElementById('ev-category').value,
        title: document.getElementById('ev-title').value.trim(),
        start_date: document.getElementById('ev-start').value || null,
        end_date: document.getElementById('ev-end').value || null,
        location: document.getElementById('ev-location').value.trim(),
        description: document.getElementById('ev-desc').value.trim(),
        image_url: imageUrl
      };

      let error;
      if (editingEventId) {
        ({ error } = await sb.from('events').update(payload).eq('id', editingEventId));
      } else {
        ({ error } = await sb.from('events').insert([payload]));
      }

      if (error) return (msg.textContent = '저장 실패: ' + error.message);

      const wasEditing = !!editingEventId;
      resetEventForm();
      msg.textContent = wasEditing ? '행사가 수정되었습니다!' : '행사가 등록되었습니다!';
      loadEvents();
    });

    // 행사 삭제
    window.deleteEvent = async (id) => {
      if (!confirm('이 행사를 삭제할까요?')) return;
      const { error } = await sb.from('events').delete().eq('id', id);
      if (error) alert('삭제 실패: ' + error.message);
      else {
        if (editingEventId === id) resetEventForm();
        loadEvents();
      }
    };

    // 쿠폰 불러오기
    async function loadCoupons() {
      const { data, error } = await sb.from('coupons').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('coupons-list');
      if (error) return (list.textContent = '불러오기 실패: ' + error.message);
      if (!data.length) {
        couponsCache = [];
        return (list.textContent = '등록된 쿠폰이 없습니다.');
      }

      couponsCache = data;
      const today = getTodayKst();

      list.innerHTML = data.map(cp => {
        const total = cp.total_quantity ?? 50;
        const issued = cp.issued_quantity ?? 0;
        const remaining = Math.max(0, total - issued);
        const isExpired = cp.valid_until && today > cp.valid_until;
        const validText = cp.valid_until ? `~ ${cp.valid_until}까지` : '상시 사용';

        return `
          <div class="item">
            ${cp.image_url ? `<img class="thumb" src="${escapeHtml(cp.image_url)}" alt="">` : ''}
            <div class="item-info">
              <div>
                <span class="badge">${escapeHtml(cp.discount_info)}</span>
                ${isExpired ? `<span class="badge badge-expired">기간 만료</span>` : ''}
                <strong>${escapeHtml(cp.store_name)}</strong>
              </div>
              <div style="font-size:13px;color:#7a6c5d;margin-top:4px;">
                남은 수량: <strong>${remaining}개</strong> / 총 ${total}개 · 유효기간: <strong>${escapeHtml(validText)}</strong>
              </div>
              ${cp.description ? `<div style="font-size:12px;color:#8d7f70;margin-top:2px;">${escapeHtml(cp.description)}</div>` : ''}
            </div>
            <div class="actions">
              <button class="edit" onclick="editCoupon(${cp.id})">수정</button>
              <button class="danger" onclick="deleteCoupon(${cp.id})">삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 쿠폰 수정 시작
    window.editCoupon = (id) => {
      const cp = couponsCache.find(item => item.id === id);
      if (!cp) return;

      editingCouponId = cp.id;
      editingImageUrl = cp.image_url || '';

      document.getElementById('cp-store').value = cp.store_name || '';
      document.getElementById('cp-discount').value = cp.discount_info || '';
      const qtyVal = String(cp.total_quantity ?? 50);
      qtyInput.value = qtyVal;
      qtyPreset.value = ['10', '30', '50', '100'].includes(qtyVal) ? qtyVal : 'custom';
      document.getElementById('cp-valid-until').value = cp.valid_until || '';
      document.getElementById('cp-desc').value = cp.description || '';
      document.getElementById('cp-image').value = '';

      document.getElementById('cp-form-title').textContent = `쿠폰 수정 (${cp.store_name})`;
      document.getElementById('cp-submit-btn').textContent = '수정 저장하기';
      document.getElementById('cp-cancel-btn').classList.remove('hidden');

      const hint = document.getElementById('cp-image-hint');
      hint.textContent = editingImageUrl
        ? '새 파일을 선택하지 않으면 기존 쿠폰 이미지가 그대로 유지됩니다.'
        : '현재 등록된 이미지가 없습니다. 필요하면 이미지를 선택해 주세요.';
      hint.classList.remove('hidden');

      document.getElementById('cp-msg').textContent = '';
      document.getElementById('coupon-form-card').scrollIntoView({ behavior: 'smooth' });
    };

    // 쿠폰 등록 및 수정 저장
    document.getElementById('coupon-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('cp-msg');
      msg.textContent = '저장 중...';

      let imageUrl = editingCouponId ? editingImageUrl : '';
      const file = document.getElementById('cp-image').files[0];

      if (file) {
        const ext = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await sb.storage.from('coupons').upload(fileName, file);
        if (upErr) return (msg.textContent = '이미지 업로드 실패: ' + upErr.message);

        const { data: urlData } = sb.storage.from('coupons').getPublicUrl(fileName);
        imageUrl = urlData.publicUrl;
      }

      const totalQty = Math.max(1, parseInt(qtyInput.value, 10) || 50);
      const validUntil = document.getElementById('cp-valid-until').value || null;

      const payload = {
        store_name: document.getElementById('cp-store').value.trim(),
        discount_info: document.getElementById('cp-discount').value.trim(),
        description: document.getElementById('cp-desc').value.trim(),
        image_url: imageUrl,
        total_quantity: totalQty,
        valid_until: validUntil
      };

      let error;
      if (editingCouponId) {
        ({ error } = await sb.from('coupons').update(payload).eq('id', editingCouponId));
      } else {
        payload.issued_quantity = 0;
        ({ error } = await sb.from('coupons').insert([payload]));
      }

      if (error) return (msg.textContent = '저장 실패: ' + error.message);

      const wasEditing = !!editingCouponId;
      resetCouponForm();
      msg.textContent = wasEditing ? '쿠폰이 수정되었습니다!' : '쿠폰이 등록되었습니다!';
      loadCoupons();
    });

    // 쿠폰 삭제
    window.deleteCoupon = async (id) => {
      if (!confirm('이 쿠폰을 삭제할까요?')) return;
      const { error } = await sb.from('coupons').delete().eq('id', id);
      if (error) alert('삭제 실패: ' + error.message);
      else {
        if (editingCouponId === id) resetCouponForm();
        loadCoupons();
      }
    };

    checkAuth();
  </script>
</body>
</html>
