<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘, 경주 - 관리자 페이지</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏯%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #faf6f0;
      --card: #ffffff;
      --accent: #8c5230;
      --accent-hover: #703f23;
      --border: #e6dccf;
      --text: #2f261f;
      --muted: #7a6c5d;
    }
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { margin: 0; font-size: 22px; color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
    .hidden { display: none !important; }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; color: var(--muted); }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; background: #fffdfb;
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    .btn-row button { margin-top: 0; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: #eee6dc; color: var(--text); margin-top: 0; }
    button.edit { background: #6b5b4d; padding: 6px 12px; font-size: 12px; margin-top: 0; }
    button.danger { background: #c94a4a; padding: 6px 12px; font-size: 12px; margin-top: 0; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tab-btn { margin-top: 0; background: #eee6dc; color: var(--text); }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .item:last-child { border-bottom: none; }
    .item-info { flex: 1; min-width: 0; }
    .badge {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: #f3e8dc; color: var(--accent); font-weight: 700; margin-right: 6px;
    }
    .badge-unlimited {
      background: #e8f3ec; color: #1f6f43;
    }
    .badge-expired {
      background: #fde8e8; color: #b91c1c;
    }
    .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }
    .msg { font-size: 13px; margin-top: 10px; color: var(--accent); font-weight: 600; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .preview-card {
      position: relative; width: 92px; background: #fff; border: 1px solid var(--border);
      border-radius: 10px; padding: 5px; cursor: grab; transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .preview-card.dragging { opacity: 0.45; }
    .preview-card.drag-over { border: 2px dashed var(--accent); transform: scale(1.03); }
    .preview-card img { width: 100%; height: 74px; object-fit: cover; border-radius: 6px; display: block; }
    .order-tag {
      position: absolute; top: 8px; left: 8px; background: rgba(47, 38, 31, 0.85); color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 99px;
    }
    .order-tag.first { background: var(--accent); }
    .del-photo-btn {
      position: absolute; top: -6px; right: -6px; margin: 0; padding: 0;
      width: 20px; height: 20px; border-radius: 99px; background: #c94a4a;
      color: #fff; font-size: 11px; line-height: 20px; text-align: center;
    }
    .order-controls {
      display: flex; justify-content: space-between; gap: 4px; margin-top: 5px;
    }
    .order-controls button {
      margin: 0; padding: 3px 0; flex: 1; font-size: 11px; border-radius: 5px;
      background: #f3e8dc; color: var(--text);
    }
    .order-controls button:hover:not(:disabled) { background: #e3d2bf; }
    .order-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
    .upload-box {
      background: #fcf9f4; border: 1px dashed var(--border); border-radius: 10px; padding: 12px; margin-top: 12px;
    }
    .upload-box label { margin-top: 0; }

    .post-block {
      padding: 16px 0; border-bottom: 1px solid var(--border);
    }
    .post-block:last-child { border-bottom: none; }
    .admin-cmt-list {
      margin-top: 10px; margin-left: 14px; padding-left: 12px;
      border-left: 2px solid #e6dccf; display: flex; flex-direction: column; gap: 6px;
    }
    .admin-cmt-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: #faf6f0; padding: 8px 12px; border-radius: 8px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>오늘, 경주 관리자</h1>
      <button id="logout-btn" class="secondary hidden">로그아웃</button>
    </div>

    <!-- 로그인 화면 -->
    <div id="login-section" class="card">
      <h2>관리자 로그인</h2>
      <form id="login-form">
        <label>이메일</label>
        <input type="email" id="login-email" required placeholder="admin@example.com" />
        <label>비밀번호</label>
        <input type="password" id="login-password" required placeholder="비밀번호 입력" />
        <button type="submit">로그인</button>
        <div id="login-msg" class="msg"></div>
      </form>
    </div>

    <!-- 관리자 대시보드 -->
    <div id="admin-section" class="hidden">
      <div class="tabs">
        <button class="tab-btn active" data-tab="events-tab">행사 관리</button>
        <button class="tab-btn" data-tab="coupons-tab">쿠폰 관리</button>
        <button class="tab-btn" data-tab="community-tab">게시판 관리</button>
      </div>

      <!-- 행사 관리 탭 -->
      <div id="events-tab">
        <div class="card" id="event-form-card">
          <h2 id="ev-form-title">새 행사 등록</h2>
          <form id="event-form">
            <div class="row">
              <div>
                <label>카테고리</label>
                <select id="ev-category">
                  <option value="축제">축제</option>
                  <option value="공연">공연</option>
                  <option value="전시">전시</option>
                  <option value="팝업·플리마켓">팝업·플리마켓</option>
                </select>
              </div>
              <div>
                <label>행사명 *</label>
                <input type="text" id="ev-title" required placeholder="예: 황리단길 야간 플리마켓" />
              </div>
            </div>
            <div class="row">
              <div>
                <label>시작일</label>
                <input type="date" id="ev-start" />
              </div>
              <div>
                <label>종료일</label>
                <input type="date" id="ev-end" />
              </div>
            </div>
            <label>장소</label>
            <input type="text" id="ev-location" placeholder="예: 경주시 황남동 일대" />
            <label>설명</label>
            <textarea id="ev-desc" placeholder="행사 시간, 입장료 등 간단한 안내"></textarea>
            <label>행사 포스터 / 사진 업로드 (선택 · 자동 용량 압축)</label>
            <input type="file" id="ev-image" accept="image/*" />
            <div id="ev-image-hint" class="hint hidden"></div>
            <div class="btn-row">
              <button type="submit" id="ev-submit-btn">행사 등록하기</button>
              <button type="button" id="ev-cancel-btn" class="secondary hidden">수정 취소</button>
            </div>
            <div id="ev-msg" class="msg"></div>
          </form>
        </div>

        <div class="card">
          <h2>등록된 행사 목록</h2>
          <div id="events-list">불러오는 중...</div>
        </div>
      </div>

      <!-- 쿠폰 관리 탭 -->
      <div id="coupons-tab" class="hidden">
        <div class="card" id="coupon-form-card">
          <h2 id="cp-form-title">새 쿠폰 등록</h2>
          <form id="coupon-form">
            <div class="row">
              <div>
                <label>매장명 *</label>
                <input type="text" id="cp-store" required placeholder="예: 황남비빔밥" />
              </div>
              <div>
                <label>할인 혜택 *</label>
                <input type="text" id="cp-discount" required placeholder="예: 전 메뉴 10% 할인" />
              </div>
            </div>

            <label>쿠폰 방식 선택 *</label>
            <select id="cp-type">
              <option value="limited">선착순 한정수량 쿠폰 (수량 지정)</option>
              <option value="unlimited">유효기간 / 상시 쿠폰 (수량 무제한)</option>
            </select>

            <div class="row" id="cp-qty-wrap">
              <div>
                <label>한정 수량 선택 *</label>
                <select id="cp-qty-preset">
                  <option value="10">선착순 10개</option>
                  <option value="30">선착순 30개</option>
                  <option value="50" selected>선착순 50개</option>
                  <option value="100">선착순 100개</option>
                  <option value="custom">직접 입력</option>
                </select>
              </div>
              <div>
                <label>수량 직접 확인 / 입력 (개)</label>
                <input type="number" id="cp-qty" min="1" value="50" required />
              </div>
            </div>

            <label id="cp-valid-label">유효기간 마감일 (선택 · 비워두면 수량 소진 시까지)</label>
            <input type="date" id="cp-valid-until" />

            <label>사용 조건 / 설명</label>
            <textarea id="cp-desc" placeholder="예: 결제 시 쿠폰 이미지 제시, 평일만 적용 등"></textarea>

            <div class="upload-box">
              <label>1. 매장 / 음식 대표 사진 업로드 (최대 5장 · 자동 압축 · ◀ ▶ 버튼이나 드래그로 순서 변경)</label>
              <input type="file" id="cp-store-images" accept="image/*" multiple />
              <div id="cp-store-images-hint" class="hint">사진을 선택한 뒤 1번(대표 사진)부터 원하는 순서대로 배치해 주세요.</div>
              <div id="cp-store-images-preview" class="preview-grid"></div>
            </div>

            <div class="upload-box">
              <label>2. 쿠폰 이미지 업로드 (쿠폰 받기를 눌렀을 때 팝업에 뜨는 이미지 · 1장 · 자동 압축)</label>
              <input type="file" id="cp-image" accept="image/*" />
              <div id="cp-image-hint" class="hint">비워두면 매장명·발급번호가 들어간 기본 쿠폰 이미지가 자동 생성됩니다.</div>
              <div id="cp-coupon-image-preview" class="preview-grid"></div>
            </div>

            <div class="btn-row">
              <button type="submit" id="cp-submit-btn">쿠폰 등록하기</button>
              <button type="button" id="cp-cancel-btn" class="secondary hidden">수정 취소</button>
            </div>
            <div id="cp-msg" class="msg"></div>
          </form>
        </div>

        <div class="card">
          <h2>등록된 쿠폰 목록</h2>
          <div id="coupons-list">불러오는 중...</div>
        </div>
      </div>

      <!-- 게시판 & 댓글 관리 탭 -->
      <div id="community-tab" class="hidden">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:10px;">
            <h2 style="border:none; padding:0; margin:0;">📝 자유게시판 글 & 댓글 관리</h2>
            <div style="display:flex; gap:6px;">
              <a href="chat.html" target="_blank" style="text-decoration:none; background:#f3e8dc; color:var(--accent); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600;">💬 채팅방 바로가기</a>
              <button type="button" class="secondary" style="padding:6px 12px; font-size:12px;" onclick="loadAdminPosts()">새로고침</button>
            </div>
          </div>
          <p class="hint" style="margin-top:0; margin-bottom:12px;">※ 실시간 채팅 삭제는 로그인된 상태에서 <strong>실시간 채팅방(chat.html)</strong>에 들어가시면 각 말풍선 옆에서 바로 삭제하실 수 있습니다.</p>
          <div id="admin-posts-list">불러오는 중...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cgwqpgmfyryegykvggyp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7nrf_n8X346CPb-5LWZycA_P3aVc--Q';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let eventsCache = [];
    let editingEventId = null;
    let editingEventImageUrl = '';

    let couponsCache = [];
    let editingCouponId = null;
    let storePhotoItems = [];
    let dragSourceIndex = null;
    let editingCouponImageUrl = '';

    const escapeHtml = (str = '') =>
      String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));

    const getTodayKst = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);

    // 이미지 자동 압축 함수 (최대 가로 1000px, JPEG 품질 0.8)
    async function compressImage(file, maxWidth = 1000, quality = 0.8) {
      if (!file || !file.type.startsWith('image/')) return file;
      if (file.type === 'image/gif') return file;

      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            if (!blob || blob.size >= file.size) {
              resolve(file);
              return;
            }
            const baseName = file.name.replace(/\.[^/.]+$/, '');
            resolve(new File([blob], `${baseName}.jpg`, { type: 'image/jpeg' }));
          }, 'image/jpeg', quality);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(file);
        };
        img.src = url;
      });
    }

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('events-tab').classList.toggle('hidden', btn.dataset.tab !== 'events-tab');
        document.getElementById('coupons-tab').classList.toggle('hidden', btn.dataset.tab !== 'coupons-tab');
        document.getElementById('community-tab').classList.toggle('hidden', btn.dataset.tab !== 'community-tab');
        if (btn.dataset.tab === 'community-tab') {
          loadAdminPosts();
        }
      });
    });

    // 쿠폰 방식(한정수량 / 무제한) 전환
    const couponTypeSelect = document.getElementById('cp-type');
    const qtyWrap = document.getElementById('cp-qty-wrap');
    const qtyPreset = document.getElementById('cp-qty-preset');
    const qtyInput = document.getElementById('cp-qty');
    const validLabel = document.getElementById('cp-valid-label');

    function syncCouponTypeUI() {
      const isLimited = couponTypeSelect.value === 'limited';
      qtyWrap.classList.toggle('hidden', !isLimited);
      qtyInput.disabled = !isLimited;
      qtyInput.required = isLimited;
      if (isLimited && (!qtyInput.value || Number(qtyInput.value) < 1)) {
        qtyPreset.value = '50';
        qtyInput.value = '50';
      }
      validLabel.textContent = isLimited
        ? '유효기간 마감일 (선택 · 비워두면 수량 소진 시까지)'
        : '유효기간 마감일 (비워두면 상시 사용 가능)';
    }

    couponTypeSelect.addEventListener('change', syncCouponTypeUI);

    qtyPreset.addEventListener('change', () => {
      if (qtyPreset.value !== 'custom') {
        qtyInput.value = qtyPreset.value;
      } else {
        qtyInput.focus();
      }
    });
    qtyInput.addEventListener('input', () => {
      qtyPreset.value = ['10', '30', '50', '100'].includes(qtyInput.value) ? qtyInput.value : 'custom';
    });

    function clearStorePhotoItems() {
      storePhotoItems.forEach(item => {
        if (item.type === 'file' && item.previewUrl) {
          URL.revokeObjectURL(item.previewUrl);
        }
      });
      storePhotoItems = [];
    }
