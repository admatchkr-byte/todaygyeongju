<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘, 경주 - 관리자 페이지</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏯%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #faf6f0;
      --card: #ffffff;
      --accent: #8c5230;
      --accent-hover: #703f23;
      --border: #e6dccf;
      --text: #2f261f;
      --muted: #7a6c5d;
    }
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { margin: 0; font-size: 22px; color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
    .hidden { display: none !important; }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; color: var(--muted); }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; background: #fffdfb;
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) {
      .row, .row-3 { grid-template-columns: 1fr; }
    }
    .btn-row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    .btn-row button { margin-top: 0; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: #eee6dc; color: var(--text); margin-top: 0; }
    button.edit { background: #6b5b4d; padding: 6px 12px; font-size: 12px; margin-top: 0; }
    button.danger { background: #c94a4a; padding: 6px 12px; font-size: 12px; margin-top: 0; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tab-btn { margin-top: 0; background: #eee6dc; color: var(--text); }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .item:last-child { border-bottom: none; }
    .item-info { flex: 1; min-width: 0; }
    .badge {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: #f3e8dc; color: var(--accent); font-weight: 700; margin-right: 6px;
    }
    .badge-cat {
      background: #efe7dd; color: #4a3b2c;
    }
    .badge-unlimited {
      background: #e8f3ec; color: #1f6f43;
    }
    .badge-expired {
      background: #fde8e8; color: #b91c1c;
    }
    .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }
    .msg { font-size: 13px; margin-top: 10px; color: var(--accent); font-weight: 600; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .preview-card {
      position: relative; width: 92px; background: #fff; border: 1px solid var(--border);
      border-radius: 10px; padding: 5px; cursor: grab; transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .preview-card.dragging { opacity: 0.45; }
    .preview-card.drag-over { border: 2px dashed var(--accent); transform: scale(1.03); }
    .preview-card img { width: 100%; height: 74px; object-fit: cover; border-radius: 6px; display: block; }
    .order-tag {
      position: absolute; top: 8px; left: 8px; background: rgba(47, 38, 31, 0.85); color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 99px;
    }
    .order-tag.first { background: var(--accent); }
    .del-photo-btn {
      position: absolute; top: -6px; right: -6px; margin: 0; padding: 0;
      width: 20px; height: 20px; border-radius: 99px; background: #c94a4a;
      color: #fff; font-size: 11px; line-height: 20px; text-align: center;
    }
    .order-controls {
      display: flex; justify-content: space-between; gap: 4px; margin-top: 5px;
    }
    .order-controls button {
      margin: 0; padding: 3px 0; flex: 1; font-size: 11px; border-radius: 5px;
      background: #f3e8dc; color: var(--text);
    }
    .order-controls button:hover:not(:disabled) { background: #e3d2bf; }
    .order-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
    .upload-box {
      background: #fcf9f4; border: 1px dashed var(--border); border-radius: 10px; padding: 12px; margin-top: 12px;
    }
    .upload-box label { margin-top: 0; }

    .post-block {
      padding: 16px 0; border-bottom: 1px solid var(--border);
    }
    .post-block:last-child { border-bottom: none; }
    .admin-cmt-list {
      margin-top: 10px; margin-left: 14px; padding-left: 12px;
      border-left: 2px solid #e6dccf; display: flex; flex-direction: column; gap: 6px;
    }
    .admin-cmt-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: #faf6f0; padding: 8px 12px; border-radius: 8px; font-size: 12px;
    }
  </style>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>오늘, 경주 관리자</h1>
      <button id="logout-btn" class="secondary hidden">로그아웃</button>
    </div>

    <!-- 로그인 화면 -->
    <div id="login-section" class="card">
      <h2>관리자 로그인</h2>
      <form id="login-form">
        <label>이메일</label>
        <input type="email" id="login-email" required placeholder="admin@example.com" />
        <label>비밀번호</label>
        <input type="password" id="login-password" required placeholder="비밀번호 입력" />
        <button type="submit">로그인</button>
        <div id="login-msg" class="msg"></div>
      </form>
    </div>

    <!-- 관리자 대시보드 -->
    <div id="admin-section" class="hidden">
      <div class="tabs">
        <button class="tab-btn active" data-tab="events-tab">행사 관리</button>
        <button class="tab-btn" data-tab="coupons-tab">쿠폰 관리</button>
        <button class="tab-btn" data-tab="community-tab">게시판 관리</button>
      </div>

      <!-- 행사 관리 탭 -->
      <div id="events-tab">
        <div class="card" id="event-form-card">
          <h2 id="ev-form-title">새 행사 등록</h2>
          <form id="event-form">
            <div class="row">
              <div>
                <label>카테고리</label>
                <select id="ev-category">
                  <option value="축제">축제</option>
                  <option value="공연">공연</option>
                  <option value="전시">전시</option>
                  <option value="팝업·플리마켓">팝업·플리마켓</option>
                </select>
              </div>
              <div>
                <label>행사명 *</label>
                <input type="text" id="ev-title" required placeholder="예: 황리단길 야간 플리마켓" />
              </div>
            </div>
            <div class="row">
              <div>
                <label>시작일</label>
                <input type="date" id="ev-start" />
              </div>
              <div>
                <label>종료일</label>
                <input type="date" id="ev-end" />
              </div>
            </div>
            <label>장소</label>
            <input type="text" id="ev-location" placeholder="예: 경주시 황남동 일대" />
            <label>설명</label>
            <textarea id="ev-desc" placeholder="행사 시간, 입장료 등 간단한 안내"></textarea>
            <label>행사 포스터 / 사진 업로드 (선택 · 자동 용량 압축)</label>
            <input type="file" id="ev-image" accept="image/*" />
            <div id="ev-image-hint" class="hint hidden"></div>
            <div class="btn-row">
              <button type="submit" id="ev-submit-btn">행사 등록하기</button>
              <button type="button" id="ev-cancel-btn" class="secondary hidden">수정 취소</button>
            </div>
            <div id="ev-msg" class="msg"></div>
          </form>
        </div>

        <div class="card">
          <h2>등록된 행사 목록</h2>
          <div id="events-list">불러오는 중...</div>
        </div>
      </div>

      <!-- 쿠폰 관리 탭 -->
      <div id="coupons-tab" class="hidden">
        <div class="card" id="coupon-form-card">
          <h2 id="cp-form-title">새 쿠폰 등록</h2>
          <form id="coupon-form">
            <div class="row-3">
              <div>
                <label>카테고리 *</label>
                <select id="cp-category" required>
                  <option value="맛집">맛집</option>
                  <option value="카페·디저트">카페·디저트</option>
                  <option value="숙소">숙소</option>
                  <option value="체험·쇼핑">체험·쇼핑</option>
                </select>
              </div>
              <div>
                <label>매장명 *</label>
                <input type="text" id="cp-store" required placeholder="예: 황남비빔밥" />
              </div>
              <div>
                <label>할인 혜택 *</label>
                <input type="text" id="cp-discount" required placeholder="예: 전 메뉴 10% 할인" />
              </div>
            </div>

            <label>쿠폰 방식 선택 *</label>
            <select id="cp-type">
              <option value="limited">선착순 한정수량 쿠폰 (수량 지정)</option>
              <option value="unlimited">유효기간 / 상시 쿠폰 (수량 무제한)</option>
            </select>

            <div class="row" id="cp-qty-wrap">
              <div>
                <label>한정 수량 선택 *</label>
                <select id="cp-qty-preset">
                  <option value="10">선착순 10개</option>
                  <option value="30">선착순 30개</option>
                  <option value="50" selected>선착순 50개</option>
                  <option value="100">선착순 100개</option>
                  <option value="custom">직접 입력</option>
                </select>
              </div>
              <div>
                <label>수량 직접 확인 / 입력 (개)</label>
                <input type="number" id="cp-qty" min="1" value="50" required />
              </div>
            </div>

            <label id="cp-valid-label">유효기간 마감일 (선택 · 비워두면 수량 소진 시까지)</label>
            <input type="date" id="cp-valid-until" />

            <label>사용 조건 / 설명</label>
            <textarea id="cp-desc" placeholder="예: 결제 시 쿠폰 이미지 제시, 평일만 적용 등"></textarea>

            <div class="upload-box">
              <label>1. 매장 / 음식 대표 사진 업로드 (최대 5장 · 자동 압축 · ◀ ▶ 버튼이나 드래그로 순서 변경)</label>
              <input type="file" id="cp-store-images" accept="image/*" multiple />
              <div id="cp-store-images-hint" class="hint">사진을 선택한 뒤 1번(대표 사진)부터 원하는 순서대로 배치해 주세요.</div>
              <div id="cp-store-images-preview" class="preview-grid"></div>
            </div>

            <div class="upload-box">
              <label>2. 쿠폰 이미지 업로드 (쿠폰 받기를 눌렀을 때 팝업에 뜨는 이미지 · 1장 · 자동 압축)</label>
              <input type="file" id="cp-image" accept="image/*" />
              <div id="cp-image-hint" class="hint">비워두면 매장명·발급번호가 들어간 기본 쿠폰 이미지가 자동 생성됩니다.</div>
              <div id="cp-coupon-image-preview" class="preview-grid"></div>
            </div>

            <div class="btn-row">
              <button type="submit" id="cp-submit-btn">쿠폰 등록하기</button>
              <button type="button" id="cp-cancel-btn" class="secondary hidden">수정 취소</button>
            </div>
            <div id="cp-msg" class="msg"></div>
          </form>
        </div>

        <div class="card">
          <h2>등록된 쿠폰 목록</h2>
          <div id="coupons-list">불러오는 중...</div>
        </div>
      </div>

      <!-- 게시판 & 댓글 관리 탭 -->
      <div id="community-tab" class="hidden">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:10px;">
            <h2 style="border:none; padding:0; margin:0;">📝 자유게시판 글 & 댓글 관리</h2>
            <div style="display:flex; gap:6px;">
              <a href="chat.html" target="_blank" style="text-decoration:none; background:#f3e8dc; color:var(--accent); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600;">💬 채팅방 바로가기</a>
              <button type="button" class="secondary" style="padding:6px 12px; font-size:12px;" onclick="loadAdminPosts()">새로고침</button>
            </div>
          </div>
          <p class="hint" style="margin-top:0; margin-bottom:12px;">※ 실시간 채팅 삭제는 로그인된 상태에서 <strong>실시간 채팅방(chat.html)</strong>에 들어가시면 각 말풍선 옆에서 바로 삭제하실 수 있습니다.</p>
          <div id="admin-posts-list">불러오는 중...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cgwqpgmfyryegykvggyp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7nrf_n8X346CPb-5LWZycA_P3aVc--Q';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let eventsCache = [];
    let editingEventId = null;
    let editingEventImageUrl = '';

    let couponsCache = [];
    let editingCouponId = null;
    let storePhotoItems = [];
    let dragSourceIndex = null;
    let editingCouponImageUrl = '';

    const escapeHtml = (str = '') =>
      String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));

    const getTodayKst = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);

    // 이미지 자동 압축 함수 (최대 가로 1000px, JPEG 품질 0.8)
    async function compressImage(file, maxWidth = 1000, quality = 0.8) {
      if (!file || !file.type.startsWith('image/')) return file;
      if (file.type === 'image/gif') return file;

      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            if (!blob || blob.size >= file.size) {
              resolve(file);
              return;
            }
            const baseName = file.name.replace(/\.[^/.]+$/, '');
            resolve(new File([blob], `${baseName}.jpg`, { type: 'image/jpeg' }));
          }, 'image/jpeg', quality);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(file);
        };
        img.src = url;
      });
    }

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('events-tab').classList.toggle('hidden', btn.dataset.tab !== 'events-tab');
        document.getElementById('coupons-tab').classList.toggle('hidden', btn.dataset.tab !== 'coupons-tab');
        document.getElementById('community-tab').classList.toggle('hidden', btn.dataset.tab !== 'community-tab');
        if (btn.dataset.tab === 'community-tab') {
          loadAdminPosts();
        }
      });
    });

    // 쿠폰 방식(한정수량 / 무제한) 전환
    const couponTypeSelect = document.getElementById('cp-type');
    const qtyWrap = document.getElementById('cp-qty-wrap');
    const qtyPreset = document.getElementById('cp-qty-preset');
    const qtyInput = document.getElementById('cp-qty');
    const validLabel = document.getElementById('cp-valid-label');

    function syncCouponTypeUI() {
      const isLimited = couponTypeSelect.value === 'limited';
      qtyWrap.classList.toggle('hidden', !isLimited);
      qtyInput.disabled = !isLimited;
      qtyInput.required = isLimited;
      if (isLimited && (!qtyInput.value || Number(qtyInput.value) < 1)) {
        qtyPreset.value = '50';
        qtyInput.value = '50';
      }
      validLabel.textContent = isLimited
        ? '유효기간 마감일 (선택 · 비워두면 수량 소진 시까지)'
        : '유효기간 마감일 (비워두면 상시 사용 가능)';
    }

    couponTypeSelect.addEventListener('change', syncCouponTypeUI);

    qtyPreset.addEventListener('change', () => {
      if (qtyPreset.value !== 'custom') {
        qtyInput.value = qtyPreset.value;
      } else {
        qtyInput.focus();
      }
    });
    qtyInput.addEventListener('input', () => {
      qtyPreset.value = ['10', '30', '50', '100'].includes(qtyInput.value) ? qtyInput.value : 'custom';
    });

    function clearStorePhotoItems() {
      storePhotoItems.forEach(item => {
        if (item.type === 'file' && item.previewUrl) {
          URL.revokeObjectURL(item.previewUrl);
        }
      });
      storePhotoItems = [];
    }

    function renderStoreImagePreviews() {
      const box = document.getElementById('cp-store-images-preview');
      const hint = document.getElementById('cp-store-images-hint');
      const remain = Math.max(0, 5 - storePhotoItems.length);

      hint.textContent = storePhotoItems.length > 0
        ? `총 ${storePhotoItems.length}장 선택됨 (추가 가능: ${remain}장) · 1번 사진이 메인 대표 사진으로 노출됩니다.`
        : '사진을 선택한 뒤 1번(대표 사진)부터 원하는 순서대로 배치해 주세요.';

      box.innerHTML = storePhotoItems.map((item, idx) => {
        const src = item.type === 'url' ? item.url : item.previewUrl;
        const label = idx === 0 ? '1·대표' : String(idx + 1);
        return `
          <div class="preview-card" draggable="true" data-idx="${idx}">
            <span class="order-tag ${idx === 0 ? 'first' : ''}">${label}</span>
            <img src="${escapeHtml(src)}" alt="매장사진 ${idx + 1}">
            <button type="button" class="del-photo-btn" title="사진 제거" onclick="removeStorePhoto(${idx})">✕</button>
            <div class="order-controls">
              <button type="button" title="앞으로 이동" onclick="moveStorePhoto(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>◀</button>
              <button type="button" title="뒤로 이동" onclick="moveStorePhoto(${idx}, 1)" ${idx === storePhotoItems.length - 1 ? 'disabled' : ''}>▶</button>
            </div>
          </div>
        `;
      }).join('');

      box.querySelectorAll('.preview-card').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          dragSourceIndex = Number(card.dataset.idx);
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          box.querySelectorAll('.preview-card').forEach(c => c.classList.remove('drag-over'));
        });
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          card.classList.add('drag-over');
        });
        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const targetIndex = Number(card.dataset.idx);
          if (dragSourceIndex === null || dragSourceIndex === targetIndex) return;
          const [moved] = storePhotoItems.splice(dragSourceIndex, 1);
          storePhotoItems.splice(targetIndex, 0, moved);
          dragSourceIndex = null;
          renderStoreImagePreviews();
        });
      });
    }

    window.moveStorePhoto = (idx, step) => {
      const target = idx + step;
      if (target < 0 || target >= storePhotoItems.length) return;
      const [moved] = storePhotoItems.splice(idx, 1);
      storePhotoItems.splice(target, 0, moved);
      renderStoreImagePreviews();
    };

    window.removeStorePhoto = (idx) => {
      const [removed] = storePhotoItems.splice(idx, 1);
      if (removed && removed.type === 'file' && removed.previewUrl) {
        URL.revokeObjectURL(removed.previewUrl);
      }
      renderStoreImagePreviews();
    };

    document.getElementById('cp-store-images').addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      if (storePhotoItems.length + files.length > 5) {
        alert(`매장 사진은 최대 5장까지 등록할 수 있습니다. (현재 ${storePhotoItems.length}장 선택됨)`);
        e.target.value = '';
        return;
      }

      files.forEach(file => {
        storePhotoItems.push({
          type: 'file',
          file,
          previewUrl: URL.createObjectURL(file)
        });
      });

      e.target.value = '';
      renderStoreImagePreviews();
    });

    function renderCouponImagePreview() {
      const box = document.getElementById('cp-coupon-image-preview');
      if (!editingCouponImageUrl) {
        box.innerHTML = '';
        return;
      }
      box.innerHTML = `
        <div class="preview-card" style="cursor:default; width:82px;">
          <img src="${escapeHtml(editingCouponImageUrl)}" alt="쿠폰 이미지">
          <button type="button" class="del-photo-btn" title="쿠폰 이미지 제거" onclick="removeSavedCouponImage()">✕</button>
        </div>
      `;
    }

    window.removeSavedCouponImage = () => {
      editingCouponImageUrl = '';
      document.getElementById('cp-image').value = '';
      renderCouponImagePreview();
    };

    function resetEventForm() {
      editingEventId = null;
      editingEventImageUrl = '';
      document.getElementById('event-form').reset();
      document.getElementById('ev-form-title').textContent = '새 행사 등록';
      document.getElementById('ev-submit-btn').textContent = '행사 등록하기';
      document.getElementById('ev-cancel-btn').classList.add('hidden');
      document.getElementById('ev-image-hint').classList.add('hidden');
      document.getElementById('ev-image-hint').textContent = '';
    }

    document.getElementById('ev-cancel-btn').addEventListener('click', () => {
      resetEventForm();
      document.getElementById('ev-msg').textContent = '';
    });

    function resetCouponForm() {
      editingCouponId = null;
      clearStorePhotoItems();
      editingCouponImageUrl = '';
      document.getElementById('coupon-form').reset();
      document.getElementById('cp-category').value = '맛집';
      couponTypeSelect.value = 'limited';
      qtyPreset.value = '50';
      qtyInput.value = '50';
      syncCouponTypeUI();
      renderStoreImagePreviews();
      renderCouponImagePreview();
      document.getElementById('cp-form-title').textContent = '새 쿠폰 등록';
      document.getElementById('cp-submit-btn').textContent = '쿠폰 등록하기';
      document.getElementById('cp-cancel-btn').classList.add('hidden');
      document.getElementById('cp-image-hint').textContent = '비워두면 매장명·발급번호가 들어간 기본 쿠폰 이미지가 자동 생성됩니다.';
    }

    document.getElementById('cp-cancel-btn').addEventListener('click', () => {
      resetCouponForm();
      document.getElementById('cp-msg').textContent = '';
    });

    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      const loggedIn = !!session;
      document.getElementById('login-section').classList.toggle('hidden', loggedIn);
      document.getElementById('admin-section').classList.toggle('hidden', !loggedIn);
      document.getElementById('logout-btn').classList.toggle('hidden', !loggedIn);
      if (loggedIn) {
        loadEvents();
        loadCoupons();
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('login-msg').textContent = '로그인 실패: ' + error.message;
      } else {
        document.getElementById('login-msg').textContent = '';
        checkAuth();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      checkAuth();
    });

    async function loadEvents() {
      const { data, error } = await sb.from('events').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('events-list');
      if (error) return (list.textContent = '불러오기 실패: ' + error.message);
      if (!data.length) {
        eventsCache = [];
        return (list.textContent = '등록된 행사가 없습니다.');
      }

      eventsCache = data;
      list.innerHTML = data.map(ev => `
        <div class="item">
          ${ev.image_url ? `<img class="thumb" src="${escapeHtml(ev.image_url)}" alt="">` : ''}
          <div class="item-info">
            <div><span class="badge">${escapeHtml(ev.category)}</span><strong>${escapeHtml(ev.title)}</strong></div>
            <div style="font-size:13px;color:#7a6c5d;margin-top:4px;">
              ${escapeHtml(ev.start_date || '미정')} ~ ${escapeHtml(ev.end_date || '미정')} · ${escapeHtml(ev.location || '장소 미정')}
            </div>
          </div>
          <div class="actions">
            <button class="edit" onclick="editEvent(${ev.id})">수정</button>
            <button class="danger" onclick="deleteEvent(${ev.id})">삭제</button>
          </div>
        </div>
      `).join('');
    }

    window.editEvent = (id) => {
      const ev = eventsCache.find(item => item.id === id);
      if (!ev) return;

      editingEventId = ev.id;
      editingEventImageUrl = ev.image_url || '';

      document.getElementById('ev-category').value = ev.category || '축제';
      document.getElementById('ev-title').value = ev.title || '';
      document.getElementById('ev-start').value = ev.start_date || '';
      document.getElementById('ev-end').value = ev.end_date || '';
      document.getElementById('ev-location').value = ev.location || '';
      document.getElementById('ev-desc').value = ev.description || '';
      document.getElementById('ev-image').value = '';

      document.getElementById('ev-form-title').textContent = `행사 수정 (${ev.title})`;
      document.getElementById('ev-submit-btn').textContent = '수정 저장하기';
      document.getElementById('ev-cancel-btn').classList.remove('hidden');

      const hint = document.getElementById('ev-image-hint');
      hint.textContent = editingEventImageUrl
        ? '새 파일을 선택하지 않으면 기존 행사 이미지가 그대로 유지됩니다.'
        : '현재 등록된 이미지가 없습니다. 필요하면 이미지를 선택해 주세요.';
      hint.classList.remove('hidden');

      document.getElementById('ev-msg').textContent = '';
      document.getElementById('event-form-card').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('ev-msg');
      msg.textContent = '저장 중...';

      let imageUrl = editingEventId ? editingEventImageUrl : '';
      const rawFile = document.getElementById('ev-image').files[0];

      if (rawFile) {
        msg.textContent = '이미지 압축 및 업로드 중...';
        const file = await compressImage(rawFile, 1000, 0.8);
        const ext = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await sb.storage.from('events').upload(fileName, file);
        if (upErr) return (msg.textContent = '이미지 업로드 실패: ' + upErr.message);

        const { data: urlData } = sb.storage.from('events').getPublicUrl(fileName);
        imageUrl = urlData.publicUrl;
      }

      const payload = {
        category: document.getElementById('ev-category').value,
        title: document.getElementById('ev-title').value.trim(),
        start_date: document.getElementById('ev-start').value || null,
        end_date: document.getElementById('ev-end').value || null,
        location: document.getElementById('ev-location').value.trim(),
        description: document.getElementById('ev-desc').value.trim(),
        image_url: imageUrl
      };

      let error;
      if (editingEventId) {
        ({ error } = await sb.from('events').update(payload).eq('id', editingEventId));
      } else {
        ({ error } = await sb.from('events').insert([payload]));
      }

      if (error) return (msg.textContent = '저장 실패: ' + error.message);

      const wasEditing = !!editingEventId;
      resetEventForm();
      msg.textContent = wasEditing ? '행사가 수정되었습니다!' : '행사가 등록되었습니다!';
      loadEvents();
    });

    window.deleteEvent = async (id) => {
      if (!confirm('이 행사를 삭제할까요?')) return;
      const { error } = await sb.from('events').delete().eq('id', id);
      if (error) alert('삭제 실패: ' + error.message);
      else {
        if (editingEventId === id) resetEventForm();
        loadEvents();
      }
    };

    async function loadCoupons() {
      const { data, error } = await sb.from('coupons').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('coupons-list');
      if (error) return (list.textContent = '불러오기 실패: ' + error.message);
      if (!data.length) {
        couponsCache = [];
        return (list.textContent = '등록된 쿠폰이 없습니다.');
      }

      couponsCache = data;
      const today = getTodayKst();

      list.innerHTML = data.map(cp => {
        const hasLimit = cp.total_quantity !== null && cp.total_quantity !== undefined;
        const total = hasLimit ? Number(cp.total_quantity) : null;
        const issued = cp.issued_quantity ?? 0;
        const remaining = hasLimit ? Math.max(0, total - issued) : null;
        const isExpired = cp.valid_until && today > cp.valid_until;
        const validText = cp.valid_until ? `~ ${cp.valid_until}까지` : '상시 사용';
        const storeImgs = Array.isArray(cp.store_images) && cp.store_images.length > 0
          ? cp.store_images
          : (cp.image_url ? [cp.image_url] : []);
        const thumbUrl = storeImgs[0] || cp.image_url || '';

        const qtyInfo = hasLimit
          ? `남은 수량: <strong>${remaining}개</strong> / 총 ${total}개`
          : `수량: <strong>무제한</strong> (발급 ${issued}명)`;

        return `
          <div class="item">
            ${thumbUrl ? `<img class="thumb" src="${escapeHtml(thumbUrl)}" alt="">` : ''}
            <div class="item-info">
              <div>
                <span class="badge badge-cat">${escapeHtml(cp.category || '맛집')}</span>
                <span class="badge">${escapeHtml(cp.discount_info)}</span>
                ${hasLimit ? '<span class="badge">한정수량</span>' : '<span class="badge badge-unlimited">수량 무제한</span>'}
                ${isExpired ? `<span class="badge badge-expired">기간 만료</span>` : ''}
                <strong>${escapeHtml(cp.store_name)}</strong>
              </div>
              <div style="font-size:13px;color:#7a6c5d;margin-top:4px;">
                ${qtyInfo} · 유효기간: <strong>${escapeHtml(validText)}</strong> · 매장사진 ${storeImgs.length}장 ${cp.image_url ? '· 쿠폰이미지 등록됨' : ''}
              </div>
              ${cp.description ? `<div style="font-size:12px;color:#8d7f70;margin-top:2px;">${escapeHtml(cp.description)}</div>` : ''}
            </div>
            <div class="actions">
              <button class="edit" onclick="editCoupon(${cp.id})">수정</button>
              <button class="danger" onclick="deleteCoupon(${cp.id})">삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.editCoupon = (id) => {
      const cp = couponsCache.find(item => item.id === id);
      if (!cp) return;

      editingCouponId = cp.id;
      clearStorePhotoItems();
      const urls = Array.isArray(cp.store_images) ? cp.store_images : [];
      urls.forEach(url => storePhotoItems.push({ type: 'url', url }));
      editingCouponImageUrl = cp.image_url || '';

      const hasLimit = cp.total_quantity !== null && cp.total_quantity !== undefined;
      couponTypeSelect.value = hasLimit ? 'limited' : 'unlimited';
      syncCouponTypeUI();

      if (hasLimit) {
        const qtyVal = String(cp.total_quantity);
        qtyInput.value = qtyVal;
        qtyPreset.value = ['10', '30', '50', '100'].includes(qtyVal) ? qtyVal : 'custom';
      }

      document.getElementById('cp-category').value = cp.category || '맛집';
      document.getElementById('cp-store').value = cp.store_name || '';
      document.getElementById('cp-discount').value = cp.discount_info || '';
      document.getElementById('cp-valid-until').value = cp.valid_until || '';
      document.getElementById('cp-desc').value = cp.description || '';
      document.getElementById('cp-store-images').value = '';
      document.getElementById('cp-image').value = '';

      renderStoreImagePreviews();
      renderCouponImagePreview();

      document.getElementById('cp-form-title').textContent = `쿠폰 수정 (${cp.store_name})`;
      document.getElementById('cp-submit-btn').textContent = '수정 저장하기';
      document.getElementById('cp-cancel-btn').classList.remove('hidden');

      document.getElementById('cp-image-hint').textContent = editingCouponImageUrl
        ? '새 파일을 선택하지 않으면 기존 쿠폰 이미지가 유지됩니다. (위 X 버튼으로 삭제 가능)'
        : '등록된 쿠폰 이미지가 없습니다. 필요하면 선택해 주세요.';

      document.getElementById('cp-msg').textContent = '';
      document.getElementById('coupon-form-card').scrollIntoView({ behavior: 'smooth' });
    };

    async function uploadToCouponsBucket(rawFile, prefix) {
      const file = await compressImage(rawFile, 1000, 0.8);
      const ext = file.name.split('.').pop();
      const fileName = `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await sb.storage.from('coupons').upload(fileName, file);
      if (error) throw error;
      const { data } = sb.storage.from('coupons').getPublicUrl(fileName);
      return data.publicUrl;
    }

    document.getElementById('coupon-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('cp-msg');
      msg.textContent = '이미지 압축 및 저장 중...';

      try {
        const finalStoreImages = [];
        for (const item of storePhotoItems.slice(0, 5)) {
          if (item.type === 'url') {
            finalStoreImages.push(item.url);
          } else if (item.type === 'file') {
            const url = await uploadToCouponsBucket(item.file, 'store');
            finalStoreImages.push(url);
          }
        }

        let couponImageUrl = editingCouponImageUrl;
        const couponFile = document.getElementById('cp-image').files[0];
        if (couponFile) {
          couponImageUrl = await uploadToCouponsBucket(couponFile, 'coupon');
        }

        const isLimited = couponTypeSelect.value === 'limited';
        const totalQty = isLimited ? Math.max(1, parseInt(qtyInput.value, 10) || 50) : null;
        const validUntil = document.getElementById('cp-valid-until').value || null;

        const payload = {
          category: document.getElementById('cp-category').value,
          store_name: document.getElementById('cp-store').value.trim(),
          discount_info: document.getElementById('cp-discount').value.trim(),
          description: document.getElementById('cp-desc').value.trim(),
          store_images: finalStoreImages,
          image_url: couponImageUrl,
          total_quantity: totalQty,
          valid_until: validUntil
        };

        let error;
        if (editingCouponId) {
          ({ error } = await sb.from('coupons').update(payload).eq('id', editingCouponId));
        } else {
          payload.issued_quantity = 0;
          ({ error } = await sb.from('coupons').insert([payload]));
        }

        if (error) throw error;

        const wasEditing = !!editingCouponId;
        resetCouponForm();
        msg.textContent = wasEditing ? '쿠폰이 수정되었습니다!' : '쿠폰이 등록되었습니다!';
        loadCoupons();
      } catch (err) {
        msg.textContent = '저장 실패: ' + (err.message || err);
      }
    });

    window.deleteCoupon = async (id) => {
      if (!confirm('이 쿠폰을 삭제할까요?')) return;
      const { error } = await sb.from('coupons').delete().eq('id', id);
      if (error) alert('삭제 실패: ' + error.message);
      else {
        if (editingCouponId === id) resetCouponForm();
        loadCoupons();
      }
    };

    // 자유게시판 글 & 댓글 통합 관리
    window.loadAdminPosts = async () => {
      const box = document.getElementById('admin-posts-list');
      const { data, error } = await sb
        .from('board_posts')
        .select('*, board_comments(id, nickname, content, created_at)')
        .order('created_at', { ascending: false })
        .limit(50);

      if (error) return (box.textContent = '불러오기 실패: ' + error.message);
      if (!data.length) return (box.textContent = '등록된 게시글이 없습니다.');

      box.innerHTML = data.map(p => {
        const comments = (p.board_comments || []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        return `
          <div class="post-block">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
              <div class="item-info">
                <div>
                  <span class="badge">${escapeHtml(p.category)}</span>
                  <strong>${escapeHtml(p.title)}</strong>
                  <span style="font-size:12px;color:#8c5230;font-weight:700;margin-left:4px;">(${comments.length})</span>
                </div>
                <div style="font-size:12px;color:#7a6c5d;margin-top:4px;">
                  작성자: ${escapeHtml(p.nickname)} · ${new Date(p.created_at).toLocaleString('ko-KR')}
                </div>
              </div>
              <div class="actions">
                <button class="danger" onclick="deleteAdminPost(${p.id})">글 삭제</button>
              </div>
            </div>

            ${comments.length > 0 ? `
              <div class="admin-cmt-list">
                ${comments.map(c => `
                  <div class="admin-cmt-row">
                    <div style="min-width:0; flex:1;">
                      <strong>💬 ${escapeHtml(c.nickname)}</strong>
                      <span style="color:#7a6c5d; margin-left:6px;">${new Date(c.created_at).toLocaleString('ko-KR')}</span>
                      <div style="margin-top:3px; color:#2f261f; word-break:break-word;">${escapeHtml(c.content)}</div>
                    </div>
                    <button class="danger" style="padding:4px 9px; font-size:11px;" onclick="deleteAdminComment(${c.id})">댓글 삭제</button>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    };

    window.deleteAdminPost = async (id) => {
      if (!confirm('이 게시글과 댓글을 모두 삭제할까요?')) return;
      const { error } = await sb.from('board_posts').delete().eq('id', id);
      if (error) alert('삭제 실패: ' + error.message);
      else loadAdminPosts();
    };

    window.deleteAdminComment = async (id) => {
      if (!confirm('이 댓글을 삭제할까요?')) return;
      const { error } = await sb.from('board_comments').delete().eq('id', id);
      if (error) alert('삭제 실패: ' + error.message);
      else loadAdminPosts();
    };

    syncCouponTypeUI();
    checkAuth();
  </script>
</body>
</html>
