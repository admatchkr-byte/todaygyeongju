<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>황리단길 대표 맛집, 카페 할인 쿠폰북 - 오늘, 경주</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏯%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #faf8f5;
            color: #2c2522;
        }
        .font-batang {
            font-family: 'Gowun Batang', serif;
        }
        button:disabled {
            cursor: not-allowed;
        }
        .coupon-progress {
            transition: width 0.3s ease;
        }
    </style>
</head>

<body class="bg-[#faf8f5] min-h-screen flex flex-col">

    <!-- 상단 네비게이션 -->
    <header class="bg-white/85 backdrop-blur-md border-b border-[#e8e2d8] sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="index.html" class="text-xl font-bold font-batang text-[#8c4a32]">오늘, 경주</a>
                <span class="text-xs bg-[#f4ebd9] text-[#8c4a32] px-2 py-0.5 rounded-full font-medium">쿠폰북 지갑</span>
            </div>
            <a href="index.html" class="text-sm font-medium text-[#8c4a32] hover:underline">← 메인으로 돌아가기</a>
        </div>
    </header>

    <!-- 쿠폰 목록 -->
    <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full">
        <div class="text-center mb-10">
            <span class="text-xs font-semibold text-[#8c4a32] tracking-wider uppercase">ANALOG COUPON BOOK</span>
           <h1 class="text-3xl font-bold font-batang mt-1 mb-2 leading-snug">
    황리단길 대표 맛집<br>
    할인 쿠폰북
</h1>
            <p class="text-sm text-gray-600">경주 엄선된 매장에서 바로 쓸 수 있는 쿠폰북입니다.</p>
            <p class="text-xs text-[#8c4a32] mt-3 font-semibold">🎟️ 제휴 매장 전용 할인 쿠폰 (1인 1매)</p>
        </div>

        <!-- 쿠폰 목록이 표시되는 영역 -->
        <div id="couponGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

        <p id="pageStatus" class="text-center text-xs text-gray-500 mt-6" aria-live="polite">
            쿠폰 목록을 불러오는 중입니다...
        </p>
    </main>

    <!-- 푸터 -->
    <footer class="bg-white border-t border-[#e8e2d8] py-8 text-center text-xs text-gray-500">
        <p class="font-batang text-sm text-[#8c4a32] font-bold mb-2">오늘, 경주 (TODAY GYEONGJU)</p>
        <p>© 2026 Today Gyeongju. All rights reserved.</p>
    </footer>

    <!-- 쿠폰 다운로드 팝업 -->
    <div id="couponModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-[#fffdf9] border-4 border-double border-[#8c4a32] rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-[#8c4a32] text-xl font-bold w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                ✕
            </button>

            <div class="text-center">
                <span id="modalCode" class="inline-block text-xs font-mono bg-[#f4ebd9] text-[#8c4a32] px-3 py-1 rounded-full border border-[#e6d5c3] mb-3 font-bold"></span>
                <h3 id="modalName" class="text-2xl font-bold font-batang text-[#2c2522] mb-2"></h3>

                <div id="modalDiscount" class="bg-rose-50 border border-rose-200 text-rose-800 rounded-xl py-3 px-4 mb-2 font-bold text-lg"></div>
                <p id="modalExpiry" class="text-xs text-gray-500 mb-4"></p>

                <p id="modalStatus" class="text-sm text-[#8c4a32] font-semibold mb-4"></p>

                <img id="couponImage" class="hidden w-full rounded-xl border border-[#d2c4b4] mb-5" alt="쿠폰 이미지">

                <button id="saveButton" onclick="saveCoupon()" disabled class="w-full bg-[#8c4a32] hover:bg-[#733b27] text-white py-3.5 rounded-xl font-bold transition text-sm disabled:opacity-50">
                    쿠폰 이미지 저장하기 📥
                </button>

                <p class="text-xs text-gray-500 mt-3 leading-relaxed">
                    매장 결제 시 저장한 쿠폰 이미지를 보여주세요. (아이폰은 공유 메뉴에서 '이미지 저장' 선택)
                </p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cgwqpgmfyryegykvggyp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_7nrf_n8X346CPb-5LWZycA_P3aVc--Q';

        let db = null;
        let couponList = [];
        let lastCouponSignature = '';
        let currentAsset = null;
        let currentModalCouponId = null;
        let currentModalJustClaimed = false;
        const claiming = new Set();

        const esc = (s = '') =>
            String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const getTodayKst = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);

        const formatValidUntil = (dateStr) => {
            if (!dateStr) return '상시 사용 가능';
            return `${dateStr.replace(/-/g, '.')}까지 사용 가능`;
        };

        const hasQuantityLimit = (cp) => cp && cp.total_quantity !== null && cp.total_quantity !== undefined;

        function getDeviceId() {
            const key = 'todaygyeongju_device_id';
            let deviceId = localStorage.getItem(key);
            if (!deviceId) {
                deviceId = crypto.randomUUID();
                localStorage.setItem(key, deviceId);
            }
            return deviceId;
        }

        function getMyClaim(id) {
            try {
                return JSON.parse(localStorage.getItem('tg_coupon_claim_' + id));
            } catch {
                return null;
            }
        }

        function revokeCurrentAsset() {
            if (currentAsset && currentAsset.url) {
                URL.revokeObjectURL(currentAsset.url);
            }
            currentAsset = null;
        }

        async function loadCoupons() {
            if (!db) return;

            const { data, error } = await db
                .from('coupons')
                .select('*')
                .order('created_at', { ascending: false });

            const grid = document.getElementById('couponGrid');
            const status = document.getElementById('pageStatus');

            if (error) {
                console.error(error);
                status.innerText = '쿠폰 정보를 불러오지 못했습니다.';
                return;
            }

            couponList = data || [];

            if (couponList.length === 0) {
                if (currentModalCouponId !== null) closeModal();
                if (lastCouponSignature !== 'EMPTY') {
                    lastCouponSignature = 'EMPTY';
                    grid.innerHTML = `
                        <div class="col-span-1 md:col-span-2 text-center py-12 bg-white border border-dashed border-[#e6d5c3] rounded-2xl text-gray-500">
                            현재 등록된 쿠폰이 없습니다. 곧 새로운 할인 혜택으로 찾아올게요!
                        </div>
                    `;
                }
                status.innerText = '';
                return;
            }

            const signature = JSON.stringify(
                couponList.map(c => [
                    c.id,
                    c.store_name,
                    c.discount_info,
                    c.description,
                    c.image_url,
                    c.total_quantity,
                    c.issued_quantity,
                    c.valid_until
                ])
            );

            if (signature !== lastCouponSignature) {
                lastCouponSignature = signature;
                renderCoupons();
            }

            status.innerText = '쿠폰 잔여 수량과 유효기간은 실시간으로 반영됩니다.';

            if (currentModalCouponId !== null) {
                const activeCp = couponList.find(item => item.id === currentModalCouponId);
                const isActiveExpired = Boolean(activeCp && activeCp.valid_until && getTodayKst() > activeCp.valid_until);
                const activeHasLimit = hasQuantityLimit(activeCp);
                const activeRemaining = activeHasLimit
                    ? Math.max(0, Number(activeCp.total_quantity) - (activeCp.issued_quantity ?? 0))
                    : null;
                const isActiveSoldOut = activeHasLimit && activeRemaining === 0;

                if (!activeCp || isActiveExpired || (!currentModalJustClaimed && isActiveSoldOut)) {
                    closeModal();
                    alert(isActiveExpired ? '유효기간이 만료되어 마감됐습니다.' : '선착순 수량이 모두 소진되어 마감됐습니다.');
                }
            }
        }

      function renderCoupons() {
            const grid = document.getElementById('couponGrid');
            const today = getTodayKst();

            grid.innerHTML = couponList.map(cp => {
                const hasLimit = hasQuantityLimit(cp);
                const total = hasLimit ? Number(cp.total_quantity) : null;
                const issued = cp.issued_quantity ?? 0;
                const remaining = hasLimit ? Math.max(0, total - issued) : null;
                const percent = hasLimit && total > 0 ? (remaining / total) * 100 : 0;
                const isExpired = Boolean(cp.valid_until && today > cp.valid_until);
                const isSoldOut = hasLimit && remaining === 0;
                const isClosed = isExpired || isSoldOut;
                const myClaim = getMyClaim(cp.id);
                const isClaiming = claiming.has(cp.id);
                const safeImg = cp.image_url && /^https?:\/\//.test(cp.image_url) ? esc(cp.image_url) : '';
                const validText = formatValidUntil(cp.valid_until);

                let badgeText = hasLimit ? '선착순 쿠폰' : (cp.valid_until ? '유효기간 쿠폰' : '상시 쿠폰');
                let badgeClass = hasLimit ? 'text-emerald-700 bg-emerald-100' : 'text-amber-800 bg-amber-100';
                let statusText = hasLimit
                    ? `🎟️ 선착순 ${remaining}개 남음 / ${total}개`
                    : `📥 현재 ${issued}명 다운로드 · ${cp.valid_until ? '유효기간 내 사용 가능' : '상시 사용 가능'}`;
                let btnText = '쿠폰 받기 📥';
                let btnDisabled = false;

                if (isClaiming) {
                    btnText = '발급 처리 중...';
                    btnDisabled = true;
                } else if (isExpired) {
                    badgeText = '기간 만료';
                    badgeClass = 'text-rose-700 bg-rose-100';
                    statusText = hasLimit
                        ? `⏰ 유효기간 만료 (발급 ${issued}명 / ${total}개)`
                        : `⏰ 유효기간 만료 (총 ${issued}명 다운로드)`;
                    btnText = '마감됐습니다 🔒';
                    btnDisabled = true;
                } else if (isSoldOut) {
                    badgeText = '선착순 마감';
                    badgeClass = 'text-rose-700 bg-rose-100';
                    statusText = '🔒 선착순 마감됐습니다';
                    btnText = '마감됐습니다 🔒';
                    btnDisabled = true;
                } else if (myClaim) {
                    btnText = '내 쿠폰 다시 보기 📥';
                }

                return `
                    <div class="bg-white border-2 border-dashed border-[#d2c4b4] rounded-2xl p-6 shadow-sm flex flex-col justify-between ${isClosed ? 'opacity-75' : ''}">
                        <div>
                            <div class="flex justify-between items-center mb-3 gap-2">
                                <span class="text-xs font-bold ${badgeClass} px-2.5 py-1 rounded">
                                    ${badgeText}
                                </span>
                                <span class="text-base font-bold text-[#8c4a32] text-right">
                                    ${esc(cp.discount_info)}
                                </span>
                            </div>
                            ${safeImg ? `<img src="${safeImg}" loading="lazy" alt="${esc(cp.store_name)}" class="w-full h-44 object-cover rounded-xl border border-[#e8e2d8] mb-4">` : ''}
                            <h3 class="font-batang font-bold text-xl mb-1">${esc(cp.store_name)}</h3>
                            <p class="text-xs font-semibold text-[#8c4a32] mb-1">📅 유효기간: ${esc(validText)}</p>
                            <p class="text-xs text-gray-500 mb-4">${esc(cp.description || '매장 방문 시 쿠폰을 제시해 주세요.')}</p>
                        </div>

                        <div>
                            <p class="text-sm font-bold ${isClosed ? 'text-rose-700' : 'text-[#8c4a32]'} ${hasLimit ? 'mb-2' : 'mb-4'}">
                                ${statusText}
                            </p>
                            ${hasLimit ? `
                                <div class="w-full h-2 bg-[#f4ebd9] rounded-full overflow-hidden mb-4">
                                    <div class="coupon-progress h-full bg-[#8c4a32] rounded-full" style="width:${isClosed ? 0 : percent}%"></div>
                                </div>
                            ` : ''}
                            <button
                                onclick="handleCouponClick(${cp.id})"
                                ${btnDisabled ? 'disabled' : ''}
                                class="w-full ${isClosed ? 'bg-gray-200 text-gray-500 border-gray-300' : 'bg-[#f4ebd9] hover:bg-[#e6d5c3] text-[#8c4a32] border-[#d2c4b4]'} font-bold py-2.5 rounded-xl transition border text-sm disabled:opacity-70">
                                ${btnText}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function handleCouponClick(couponId) {
            const cp = couponList.find(item => item.id === couponId);
            if (!cp || claiming.has(couponId)) return;

            if (cp.valid_until && getTodayKst() > cp.valid_until) {
                closeModal();
                alert('유효기간이 만료되어 마감됐습니다.');
                lastCouponSignature = '';
                await loadCoupons();
                return;
            }

            if (hasQuantityLimit(cp) && (Number(cp.total_quantity) - (cp.issued_quantity ?? 0)) <= 0) {
                closeModal();
                alert('선착순 수량이 모두 소진되어 마감됐습니다.');
                lastCouponSignature = '';
                await loadCoupons();
                return;
            }

            const saved = getMyClaim(couponId);
            if (saved) {
                await openCouponModal(cp, saved, false);
                return;
            }

            claiming.add(couponId);
            renderCoupons();

            try {
                const { data, error } = await db.rpc('claim_coupon', {
                    p_coupon_id: couponId,
                    p_device_id: getDeviceId()
                });

                if (error) throw error;

                if (!data || !data.success) {
                    closeModal();
                    if (data && data.error === 'EXPIRED') {
                        alert('유효기간이 만료되어 마감됐습니다.');
                    } else if (data && data.error === 'SOLD_OUT') {
                        alert('선착순 수량이 모두 소진되어 마감됐습니다.');
                    } else {
                        alert('쿠폰을 발급하지 못했습니다. 잠시 후 다시 시도해 주세요.');
                    }
                    return;
                }

                const claimRecord = { claim_id: data.claim_id };
                localStorage.setItem('tg_coupon_claim_' + couponId, JSON.stringify(claimRecord));
                await openCouponModal(cp, claimRecord, !data.already_claimed);
            } catch (err) {
                console.error(err);
                closeModal();
                alert('쿠폰 발급 중 오류가 발생했습니다.');
            } finally {
                claiming.delete(couponId);
                lastCouponSignature = '';
                await loadCoupons();
            }
        }

        async function createFallbackCouponImage(cp, claimId) {
            await document.fonts.ready;
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1350;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#faf8f5';
            ctx.fillRect(0, 0, 1080, 1350);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(70, 70, 940, 1210);

            ctx.strokeStyle = '#d2c4b4';
            ctx.lineWidth = 5;
            ctx.setLineDash([15, 10]);
            ctx.strokeRect(70, 70, 940, 1210);
            ctx.setLineDash([]);

            ctx.fillStyle = '#8c4a32';
            ctx.fillRect(70, 70, 940, 230);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 70px Pretendard, sans-serif';
            ctx.fillText('오늘, 경주', 540, 170);
            ctx.font = '28px Pretendard, sans-serif';
            ctx.fillText('TODAY GYEONGJU COUPON', 540, 240);

            ctx.fillStyle = '#8c4a32';
            ctx.font = 'bold 42px Pretendard, sans-serif';
            ctx.fillText('황리단길 할인 쿠폰', 540, 410);

            ctx.fillStyle = '#2c2522';
            ctx.font = 'bold 72px Pretendard, sans-serif';
            ctx.fillText(cp.store_name, 540, 560, 850);

            ctx.fillStyle = '#8c4a32';
            ctx.font = 'bold 64px Pretendard, sans-serif';
            ctx.fillText(cp.discount_info, 540, 720, 850);

            ctx.strokeStyle = '#d2c4b4';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(150, 830);
            ctx.lineTo(930, 830);
            ctx.stroke();

            ctx.fillStyle = '#555555';
            ctx.font = 'bold 34px monospace';
            ctx.fillText('발급번호 #' + String(claimId).padStart(4, '0'), 540, 940);

            ctx.fillStyle = '#8c4a32';
            ctx.font = 'bold 30px Pretendard, sans-serif';
            ctx.fillText('유효기간: ' + formatValidUntil(cp.valid_until), 540, 1030, 850);

            ctx.fillStyle = '#555555';
            ctx.font = '28px Pretendard, sans-serif';
            ctx.fillText('매장 직원에게 쿠폰을 보여주세요.', 540, 1180, 850);

            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (!blob) return reject(new Error('이미지 생성 실패'));
                    const filename = `오늘경주_${cp.store_name}_쿠폰.png`;
                    resolve({
                        file: new File([blob], filename, { type: 'image/png' }),
                        filename,
                        url: URL.createObjectURL(blob)
                    });
                }, 'image/png');
            });
        }

        async function openCouponModal(cp, claimRecord, isNew) {
            revokeCurrentAsset();
            currentModalCouponId = cp.id;
            currentModalJustClaimed = Boolean(isNew);

            document.getElementById('modalCode').innerText = '발급번호 #' + String(claimRecord.claim_id).padStart(4, '0');
            document.getElementById('modalName').innerText = cp.store_name;
            document.getElementById('modalDiscount').innerText = '🎉 ' + cp.discount_info;
            document.getElementById('modalExpiry').innerText = '📅 유효기간: ' + formatValidUntil(cp.valid_until);
            document.getElementById('modalStatus').innerText = '쿠폰 이미지를 준비하고 있습니다...';

            const imgEl = document.getElementById('couponImage');
            imgEl.classList.add('hidden');
            document.getElementById('saveButton').disabled = true;

            const modal = document.getElementById('couponModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                if (cp.image_url && /^https?:\/\//.test(cp.image_url)) {
                    const res = await fetch(cp.image_url);
                    const blob = await res.blob();
                    const ext = (blob.type && blob.type.split('/')[1]) || 'png';
                    const filename = `오늘경주_${cp.store_name}_쿠폰.${ext}`;
                    currentAsset = {
                        file: new File([blob], filename, { type: blob.type || 'image/png' }),
                        filename,
                        url: URL.createObjectURL(blob)
                    };
                } else {
                    currentAsset = await createFallbackCouponImage(cp, claimRecord.claim_id);
                }

                if (currentModalCouponId !== cp.id) {
                    revokeCurrentAsset();
                    return;
                }

                imgEl.src = currentAsset.url;
                imgEl.classList.remove('hidden');
                document.getElementById('saveButton').disabled = false;
                document.getElementById('modalStatus').innerText = isNew
                    ? '🎉 쿠폰 발급 완료! 아래 버튼으로 저장하세요.'
                    : '이미 발급받은 쿠폰입니다. 다시 저장할 수 있어요.';
            } catch (e) {
                console.error(e);
                if (currentModalCouponId !== cp.id) return;
                if (cp.image_url) {
                    imgEl.src = cp.image_url;
                    imgEl.classList.remove('hidden');
                }
                document.getElementById('modalStatus').innerText = '쿠폰이 확인되었습니다. 이미지를 길게 눌러 저장해 주세요.';
            }
        }

        function forceDownload(asset) {
            const link = document.createElement('a');
            link.href = asset.url;
            link.download = asset.filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function saveCoupon() {
            const activeCp = couponList.find(item => item.id === currentModalCouponId);
            const activeHasLimit = hasQuantityLimit(activeCp);
            const activeRemaining = activeHasLimit
                ? Math.max(0, Number(activeCp.total_quantity) - (activeCp.issued_quantity ?? 0))
                : null;
            if (!activeCp || (!currentModalJustClaimed && activeHasLimit && activeRemaining === 0)) {
                closeModal();
                alert('선착순 수량이 모두 소진되어 마감됐습니다.');
                return;
            }

            if (!currentAsset) return;
            if (navigator.canShare && navigator.canShare({ files: [currentAsset.file] })) {
                navigator.share({
                    files: [currentAsset.file],
                    title: '오늘, 경주 할인 쿠폰'
                }).catch(err => {
                    if (err.name !== 'AbortError') forceDownload(currentAsset);
                });
            } else {
                forceDownload(currentAsset);
            }
        }

        function closeModal() {
            const modal = document.getElementById('couponModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            currentModalCouponId = null;
            currentModalJustClaimed = false;
            revokeCurrentAsset();
        }

        async function init() {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
            });
            await loadCoupons();
            setInterval(() => { if (!document.hidden) loadCoupons(); }, 30000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCoupons(); });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
