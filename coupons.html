<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>황리단길 대표 맛집, 할인 쿠폰북 - 오늘, 경주</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏯%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #faf8f5;
            color: #2c2522;
        }
        .font-batang {
            font-family: 'Gowun Batang', serif;
        }
        button:disabled {
            cursor: not-allowed;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="bg-[#faf8f5] min-h-screen flex flex-col">

    <!-- 상단 네비게이션 -->
    <header class="bg-white/85 backdrop-blur-md border-b border-[#e8e2d8] sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-14 md:h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="index.html" class="text-lg md:text-xl font-bold font-batang text-[#8c4a32]">오늘, 경주</a>
                <span class="text-[11px] md:text-xs bg-[#f4ebd9] text-[#8c4a32] px-2 py-0.5 rounded-full font-medium">쿠폰북 지갑</span>
            </div>
            <a href="index.html" class="text-xs md:text-sm font-medium text-[#8c4a32] hover:underline">← 메인으로</a>
        </div>
    </header>

    <!-- 쿠폰 목록 -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-7 md:py-10 flex-grow w-full">
        <div class="text-center mb-5">
            <span class="text-[11px] font-semibold text-[#8c4a32] tracking-wider uppercase">
                ANALOG COUPON BOOK
            </span>
            <h1 class="text-2xl md:text-3xl font-bold font-batang mt-1 mb-1.5 leading-snug">
                황리단길 대표 맛집<span class="hidden md:inline">, </span><br class="md:hidden">
                할인 쿠폰북
            </h1>
            <p class="text-xs md:text-sm text-gray-600">
                경주 엄선된 매장에서 바로 쓸 수 있는 쿠폰북입니다.
            </p>
        </div>

        <!-- 5개 카테고리 필터 탭 -->
        <div id="couponCategoryTabs" class="flex flex-wrap justify-center gap-1.5 md:gap-2 mb-6">
            <button type="button" data-cat="전체" class="cp-cat-btn px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-bold bg-[#8c4a32] text-white shadow-sm transition">
                전체
            </button>
            <button type="button" data-cat="맛집" class="cp-cat-btn px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-semibold bg-white text-[#6b5b4d] border border-[#e6d5c3] hover:bg-[#f4ebd9] transition">
                맛집
            </button>
            <button type="button" data-cat="카페·디저트" class="cp-cat-btn px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-semibold bg-white text-[#6b5b4d] border border-[#e6d5c3] hover:bg-[#f4ebd9] transition">
                카페·디저트
            </button>
            <button type="button" data-cat="숙소" class="cp-cat-btn px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-semibold bg-white text-[#6b5b4d] border border-[#e6d5c3] hover:bg-[#f4ebd9] transition">
                숙소
            </button>
            <button type="button" data-cat="체험·쇼핑" class="cp-cat-btn px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-semibold bg-white text-[#6b5b4d] border border-[#e6d5c3] hover:bg-[#f4ebd9] transition">
                체험·쇼핑
            </button>
        </div>

        <!-- 3x3 바둑판 쿠폰 그리드 (모바일·PC 모두 가로 3칸) -->
        <div id="couponGrid" class="grid grid-cols-3 gap-2 sm:gap-3.5 md:gap-5">
            <div class="col-span-3 text-center py-12 text-gray-500 text-xs md:text-sm">
                쿠폰 목록을 불러오는 중입니다...
            </div>
        </div>

        <!-- 페이지네이션 (1, 2, 3...) -->
        <div id="paginationWrap" class="mt-7 flex items-center justify-center gap-1.5"></div>

        <p id="pageStatus" class="text-center text-[11px] md:text-xs text-gray-500 mt-4" aria-live="polite">
            쿠폰 잔여 수량은 실시간으로 반영됩니다.
        </p>
    </main>

    <!-- 푸터 -->
    <footer class="bg-white border-t border-[#e8e2d8] py-8 text-center text-xs text-gray-500">
        <p class="font-batang text-sm text-[#8c4a32] font-bold mb-2">오늘, 경주 (TODAY GYEONGJU)</p>
        <p>© 2026 Today Gyeongju. All rights reserved.</p>
    </footer>

    <!-- 쿠폰 다운로드 팝업 -->
    <div id="couponModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-[#fffdf9] border-4 border-double border-[#8c4a32] rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[95vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-[#8c4a32] text-xl font-bold w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                ✕
            </button>

            <div class="text-center">
                <span id="modalCode" class="inline-block text-xs font-mono bg-[#f4ebd9] text-[#8c4a32] px-3 py-1 rounded-full border border-[#e6d5c3] mb-3 font-bold"></span>
                <h3 id="modalName" class="text-2xl font-bold font-batang text-[#2c2522] mb-2"></h3>

                <div id="modalDiscount" class="bg-rose-50 border border-rose-200 text-rose-800 rounded-xl py-3 px-4 mb-2 font-bold text-lg"></div>
                <p id="modalValidUntil" class="text-xs text-[#6b5b4d] font-semibold mb-1.5"></p>
                <p id="modalDesc" class="text-xs text-gray-500 mb-3"></p>
                <p id="modalStatus" class="text-sm text-[#8c4a32] font-semibold mb-4"></p>

                <img id="couponImage" class="hidden w-full rounded-xl border border-[#d2c4b4] mb-5" alt="발급된 쿠폰 이미지">

                <button id="saveButton" onclick="saveCoupon()" disabled class="w-full bg-[#8c4a32] hover:bg-[#733b27] text-white py-3.5 rounded-xl font-bold transition text-sm disabled:opacity-50">
                    쿠폰 이미지 저장하기 📥
                </button>

                <p class="text-xs text-gray-500 mt-3 leading-relaxed">
                    아이폰은 공유 메뉴에서 '이미지 저장'을 선택해 주세요.
                </p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cgwqpgmfyryegykvggyp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_7nrf_n8X346CPb-5LWZycA_P3aVc--Q';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
        });

        const ITEMS_PER_PAGE = 9; // 3 x 3 바둑판 (한 페이지당 9개)
        let couponList = [];
        let currentCategory = '전체';
        let currentPage = 1;
        let lastCouponSignature = '';
        let currentAsset = null;
        let activeModalCouponId = null;
        const issuingIds = new Set();

        const esc = (s = '') =>
            String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const getTodayKst = () => new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);

        function getDeviceId() {
            const key = 'todaygyeongju_device_id';
            let deviceId = localStorage.getItem(key);
            if (!deviceId) {
                deviceId = crypto.randomUUID();
                localStorage.setItem(key, deviceId);
            }
            return deviceId;
        }

        function getMyClaim(couponId) {
            try {
                return JSON.parse(localStorage.getItem('tg_claim_' + couponId));
            } catch {
                return null;
            }
        }

        function setMyClaim(couponId, claimObj) {
            localStorage.setItem('tg_claim_' + couponId, JSON.stringify(claimObj));
        }

        // 카테고리 버튼 클릭
        document.getElementById('couponCategoryTabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.cp-cat-btn');
            if (!btn) return;
            currentCategory = btn.dataset.cat;
            currentPage = 1;
            document.querySelectorAll('.cp-cat-btn').forEach(b => {
                const active = b.dataset.cat === currentCategory;
                b.className = active
                    ? 'cp-cat-btn px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-bold bg-[#8c4a32] text-white shadow-sm transition'
                    : 'cp-cat-btn px-3 md:px-4 py-1.5 md:py-2 rounded-full text-xs md:text-sm font-semibold bg-white text-[#6b5b4d] border border-[#e6d5c3] hover:bg-[#f4ebd9] transition';
            });
            renderCoupons();
        });

        window.goToPage = (page) => {
            currentPage = page;
            renderCoupons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        async function loadCoupons() {
            const { data, error } = await sb
                .from('coupons')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                document.getElementById('pageStatus').textContent = '쿠폰 정보를 불러오지 못했습니다.';
                return;
            }

            couponList = data || [];

            if (activeModalCouponId !== null) {
                const activeCp = couponList.find(c => c.id === activeModalCouponId);
                if (activeCp) {
                    const hasLimit = activeCp.total_quantity !== null && activeCp.total_quantity !== undefined;
                    const rem = hasLimit ? Math.max(0, Number(activeCp.total_quantity) - (activeCp.issued_quantity ?? 0)) : null;
                    if (hasLimit && rem === 0 && !getMyClaim(activeCp.id)) {
                        closeModal();
                        alert('선착순 수량이 모두 소진되어 마감됐습니다.');
                    }
                }
            }

            const signature = JSON.stringify(
                couponList.map(c => [c.id, c.category, c.issued_quantity, c.total_quantity, c.valid_until, c.store_name, c.store_images, c.image_url])
            );
            if (signature === lastCouponSignature) return;
            lastCouponSignature = signature;

            renderCoupons();
        }

        function renderPagination(totalPages) {
            const wrap = document.getElementById('paginationWrap');
            if (totalPages <= 1) {
                wrap.innerHTML = '';
                return;
            }

            let html = `
                <button type="button" onclick="goToPage(${Math.max(1, currentPage - 1)})" ${currentPage === 1 ? 'disabled' : ''}
                    class="w-8 h-8 rounded-lg border border-[#e6d5c3] bg-white text-xs font-bold text-[#6b5b4d] disabled:opacity-40">
                    ‹
                </button>
            `;

            for (let p = 1; p <= totalPages; p++) {
                const active = p === currentPage;
                html += `
                    <button type="button" onclick="goToPage(${p})"
                        class="w-8 h-8 rounded-lg text-xs font-bold transition ${active ? 'bg-[#8c4a32] text-white shadow-xs' : 'bg-white border border-[#e6d5c3] text-[#6b5b4d] hover:bg-[#f4ebd9]'}">
                        ${p}
                    </button>
                `;
            }

            html += `
                <button type="button" onclick="goToPage(${Math.min(totalPages, currentPage + 1)})" ${currentPage === totalPages ? 'disabled' : ''}
                    class="w-8 h-8 rounded-lg border border-[#e6d5c3] bg-white text-xs font-bold text-[#6b5b4d] disabled:opacity-40">
                    ›
                </button>
            `;

            wrap.innerHTML = html;
        }

        function renderCoupons() {
            const grid = document.getElementById('couponGrid');
            const filtered = couponList.filter(cp => {
                if (currentCategory === '전체') return true;
                return (cp.category || '맛집') === currentCategory;
            });

            if (filtered.length === 0) {
                document.getElementById('paginationWrap').innerHTML = '';
                grid.innerHTML = `
                    <div class="col-span-3 bg-white border border-dashed border-[#e6d5c3] rounded-2xl p-10 text-center text-gray-500 text-xs md:text-sm">
                        '${esc(currentCategory)}' 카테고리에 등록된 쿠폰이 아직 없습니다.
                    </div>
                `;
                return;
            }

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;

            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageItems = filtered.slice(startIdx, startIdx + ITEMS_PER_PAGE);
            const today = getTodayKst();

            grid.innerHTML = pageItems.map(cp => {
                const hasLimit = cp.total_quantity !== null && cp.total_quantity !== undefined;
                const total = hasLimit ? Number(cp.total_quantity) : null;
                const issued = cp.issued_quantity ?? 0;
                const remaining = hasLimit ? Math.max(0, total - issued) : null;

                const isExpired = Boolean(cp.valid_until && today > cp.valid_until);
                const isSoldOut = hasLimit && remaining === 0;
                const myClaim = getMyClaim(cp.id);
                const isIssuing = issuingIds.has(cp.id);

                const storeImgs = Array.isArray(cp.store_images) && cp.store_images.length > 0
                    ? cp.store_images.filter(u => /^https?:\/\//.test(u))
                    : (cp.image_url && /^https?:\/\//.test(cp.image_url) ? [cp.image_url] : []);

                // 3x3 바둑판에 맞춘 한 줄 상태 요약
                let subStatus = '';
                if (isExpired) {
                    subStatus = `<p class="text-[10px] md:text-xs font-bold text-rose-600 truncate">기간 만료</p>`;
                } else if (isSoldOut) {
                    subStatus = `<p class="text-[10px] md:text-xs font-bold text-rose-600 truncate">선착순 마감</p>`;
                } else if (hasLimit) {
                    subStatus = `<p class="text-[10px] md:text-xs font-semibold text-[#8c4a32] truncate">잔여 ${remaining}/${total}개</p>`;
                } else {
                    subStatus = `<p class="text-[10px] md:text-xs font-semibold text-emerald-700 truncate">${issued}명 다운</p>`;
                }

                let btnText = '쿠폰 받기';
                let btnDisabled = false;
                let btnClass = 'bg-[#8c4a32] hover:bg-[#733b27] text-white';

                if (isIssuing) {
                    btnText = '발급 중';
                    btnDisabled = true;
                    btnClass = 'bg-[#f4ebd9] text-[#8c4a32]';
                } else if (myClaim) {
                    btnText = '내 쿠폰';
                    btnDisabled = false;
                    btnClass = 'bg-[#f4ebd9] hover:bg-[#e6d5c3] text-[#8c4a32] border border-[#d2c4b4]';
                } else if (isExpired) {
                    btnText = '만료';
                    btnDisabled = true;
                    btnClass = 'bg-gray-200 text-gray-500';
                } else if (isSoldOut) {
                    btnText = '마감';
                    btnDisabled = true;
                    btnClass = 'bg-gray-200 text-gray-500';
                }

                return `
                    <div class="bg-white border border-[#e6d5c3] rounded-xl md:rounded-2xl overflow-hidden shadow-xs flex flex-col justify-between">
                        <!-- 정사각형 매장 사진 (1:1 바둑판 비율) -->
                        <div class="relative aspect-square w-full bg-[#f4ebd9] overflow-hidden">
                            ${storeImgs.length > 0 ? `
                                <div id="slider-${cp.id}" onscroll="syncSliderDots(${cp.id}, ${storeImgs.length})" class="flex w-full h-full overflow-x-auto snap-x snap-mandatory no-scrollbar">
                                    ${storeImgs.map((url, idx) => `
                                        <img src="${esc(url)}" loading="lazy" alt="${esc(cp.store_name)} ${idx + 1}" class="w-full h-full object-cover shrink-0 snap-center">
                                    `).join('')}
                                </div>
                                ${storeImgs.length > 1 ? `
                                    <div id="dots-${cp.id}" class="absolute bottom-1.5 inset-x-0 flex justify-center gap-1 pointer-events-none">
                                        ${storeImgs.map((_, idx) => `
                                            <span class="w-1 h-1 md:w-1.5 md:h-1.5 rounded-full transition ${idx === 0 ? 'bg-white scale-125' : 'bg-white/55'}"></span>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            ` : `
                                <div class="w-full h-full flex items-center justify-center text-2xl md:text-3xl">🏯</div>
                            `}

                            <!-- 할인 혜택 배지 -->
                            <span class="absolute top-1.5 left-1.5 max-w-[88%] truncate text-[9px] sm:text-[11px] md:text-xs font-bold bg-[#8c4a32]/95 text-white px-1.5 sm:px-2 py-0.5 rounded-full shadow-xs">
                                ${esc(cp.discount_info)}
                            </span>
                        </div>

                        <!-- 하단 매장명 + 상태 + 버튼 -->
                        <div class="p-2 sm:p-3 flex flex-col justify-between flex-1">
                            <div class="mb-1.5">
                                <h3 class="font-batang font-bold text-xs sm:text-sm md:text-base text-[#2c2522] truncate">
                                    ${esc(cp.store_name)}
                                </h3>
                                ${subStatus}
                            </div>

                            <button
                                onclick="handleCouponClick(${cp.id})"
                                ${btnDisabled ? 'disabled' : ''}
                                class="w-full ${btnClass} font-bold py-1.5 md:py-2 rounded-lg transition text-[11px] sm:text-xs md:text-sm"
                            >
                                ${btnText}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages);
        }

        window.syncSliderDots = (couponId, total) => {
            const el = document.getElementById('slider-' + couponId);
            const dotsBox = document.getElementById('dots-' + couponId);
            if (!el || !dotsBox || !el.clientWidth) return;
            const activeIdx = Math.min(total - 1, Math.max(0, Math.round(el.scrollLeft / el.clientWidth)));
            Array.from(dotsBox.children).forEach((dot, idx) => {
                dot.className = `w-1 h-1 md:w-1.5 md:h-1.5 rounded-full transition ${idx === activeIdx ? 'bg-white scale-125' : 'bg-white/55'}`;
            });
        };

        async function handleCouponClick(couponId) {
            const coupon = couponList.find(c => c.id === couponId);
            if (!coupon || issuingIds.has(couponId)) return;

            const savedClaim = getMyClaim(couponId);
            if (savedClaim) {
                await openCouponModal(coupon, savedClaim, false);
                return;
            }

            const today = getTodayKst();
            if (coupon.valid_until && today > coupon.valid_until) {
                alert('유효기간이 만료된 쿠폰입니다.');
                lastCouponSignature = '';
                await loadCoupons();
                return;
            }

            const hasLimit = coupon.total_quantity !== null && coupon.total_quantity !== undefined;
            if (hasLimit && Number(coupon.total_quantity) - (coupon.issued_quantity ?? 0) <= 0) {
                alert('선착순 수량이 모두 소진되어 마감됐습니다.');
                lastCouponSignature = '';
                await loadCoupons();
                return;
            }

            issuingIds.add(couponId);
            renderCoupons();

            try {
                const { data, error } = await sb.rpc('claim_coupon', {
                    p_coupon_id: couponId,
                    p_device_id: getDeviceId()
                });

                if (error) throw error;

                if (!data || !data.success) {
                    if (data && data.error === 'EXPIRED') {
                        alert('유효기간이 만료된 쿠폰입니다.');
                    } else if (data && data.error === 'SOLD_OUT') {
                        closeModal();
                        alert('선착순 수량이 모두 소진되어 마감됐습니다.');
                    } else {
                        alert('쿠폰 발급에 실패했습니다. 잠시 후 다시 시도해 주세요.');
                    }
                    return;
                }

                const claimObj = {
                    claim_id: data.claim_id,
                    coupon_id: couponId
                };
                setMyClaim(couponId, claimObj);

                await openCouponModal(coupon, claimObj, !data.already_claimed);
            } catch (err) {
                console.error(err);
                alert('쿠폰 발급 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
            } finally {
                issuingIds.delete(couponId);
                lastCouponSignature = '';
                await loadCoupons();
            }
        }

        async function buildCouponAsset(coupon, claimObj) {
            const issueNo = String(claimObj.claim_id).padStart(4, '0');
            const filename = `오늘경주_${coupon.store_name}_No${issueNo}.png`;

            if (coupon.image_url && /^https?:\/\//.test(coupon.image_url)) {
                try {
                    const res = await fetch(coupon.image_url);
                    const blob = await res.blob();
                    const file = new File([blob], filename, { type: blob.type || 'image/png' });
                    return {
                        file,
                        filename,
                        url: URL.createObjectURL(blob),
                        isObjectUrl: true
                    };
                } catch {
                    return {
                        file: null,
                        filename,
                        url: coupon.image_url,
                        isObjectUrl: false
                    };
                }
            }

            await document.fonts.ready;
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1350;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#faf8f5';
            ctx.fillRect(0, 0, 1080, 1350);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(70, 70, 940, 1210);

            ctx.strokeStyle = '#d2c4b4';
            ctx.lineWidth = 5;
            ctx.setLineDash([15, 10]);
            ctx.strokeRect(70, 70, 940, 1210);
            ctx.setLineDash([]);

            ctx.fillStyle = '#8c4a32';
            ctx.fillRect(70, 70, 940, 230);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 70px Pretendard, sans-serif';
            ctx.fillText('오늘, 경주', 540, 170);

            ctx.font = '28px Pretendard, sans-serif';
            ctx.fillText('TODAY GYEONGJU COUPON', 540, 240);

            ctx.fillStyle = '#8c4a32';
            ctx.font = 'bold 42px Pretendard, sans-serif';
            ctx.fillText('황리단길 제휴 할인 쿠폰', 540, 410);

            ctx.fillStyle = '#2c2522';
            ctx.font = 'bold 74px Pretendard, sans-serif';
            ctx.fillText(coupon.store_name, 540, 560, 850);

            ctx.fillStyle = '#8c4a32';
            ctx.font = 'bold 110px Pretendard, sans-serif';
            ctx.fillText(coupon.discount_info, 540, 730, 850);

            ctx.strokeStyle = '#d2c4b4';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(150, 810);
            ctx.lineTo(930, 810);
            ctx.stroke();

            ctx.fillStyle = '#555555';
            ctx.font = 'bold 36px monospace';
            ctx.fillText(`발급번호 #${issueNo}`, 540, 900);

            const validLine = coupon.valid_until ? `유효기간: ~ ${coupon.valid_until}까지` : '유효기간: 상시 사용 가능';
            ctx.fillStyle = '#8c4a32';
            ctx.font = 'bold 30px Pretendard, sans-serif';
            ctx.fillText(validLine, 540, 975, 850);

            if (coupon.description) {
                ctx.fillStyle = '#6b5b4d';
                ctx.font = '26px Pretendard, sans-serif';
                ctx.fillText(coupon.description, 540, 1055, 840);
            }

            ctx.fillStyle = '#444444';
            ctx.font = 'bold 28px Pretendard, sans-serif';
            ctx.fillText('매장 직원에게 쿠폰 이미지를 보여주세요.', 540, 1185, 850);

            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (!blob) return reject(new Error('이미지 생성 실패'));
                    const file = new File([blob], filename, { type: 'image/png' });
                    resolve({ file, filename, url: URL.createObjectURL(blob), isObjectUrl: true });
                }, 'image/png');
            });
        }

        async function openCouponModal(coupon, claimObj, isNewIssue) {
            if (currentAsset && currentAsset.isObjectUrl && currentAsset.url) {
                URL.revokeObjectURL(currentAsset.url);
            }
            currentAsset = null;
            activeModalCouponId = coupon.id;

            const issueNo = String(claimObj.claim_id).padStart(4, '0');
            document.getElementById('modalCode').textContent = `발급번호 #${issueNo}`;
            document.getElementById('modalName').textContent = coupon.store_name;
            document.getElementById('modalDiscount').textContent = `🎉 ${coupon.discount_info}`;
            document.getElementById('modalValidUntil').textContent = coupon.valid_until
                ? `📅 유효기간: ${coupon.valid_until.replace(/-/g, '.')}까지 사용 가능`
                : '📅 유효기간: 상시 사용 가능';
            document.getElementById('modalDesc').textContent = coupon.description || '';
            document.getElementById('modalStatus').textContent = '쿠폰 이미지를 준비하고 있습니다...';

            const preview = document.getElementById('couponImage');
            preview.classList.add('hidden');
            document.getElementById('saveButton').disabled = true;

            const modal = document.getElementById('couponModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const asset = await buildCouponAsset(coupon, claimObj);
                currentAsset = asset;
                preview.src = asset.url;
                preview.classList.remove('hidden');
                document.getElementById('saveButton').disabled = false;

                document.getElementById('modalStatus').textContent = isNewIssue
                    ? '🎉 쿠폰 발급 완료! 아래 버튼으로 이미지를 저장해 주세요.'
                    : '이미 발급받은 쿠폰입니다. 다시 저장할 수 있어요.';
            } catch (err) {
                console.error(err);
                document.getElementById('modalStatus').textContent = '쿠폰 이미지를 불러오지 못했습니다.';
            }
        }

        function forceDownload(asset) {
            const link = document.createElement('a');
            link.href = asset.url;
            link.download = asset.filename;
            if (!asset.isObjectUrl) link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function saveCoupon() {
            if (!currentAsset) return;
            if (currentAsset.file && navigator.canShare && navigator.canShare({ files: [currentAsset.file] })) {
                navigator.share({
                    files: [currentAsset.file],
                    title: '오늘, 경주 할인 쿠폰'
                }).catch(err => {
                    if (err.name !== 'AbortError') forceDownload(currentAsset);
                });
            } else {
                forceDownload(currentAsset);
            }
        }

        function closeModal() {
            const modal = document.getElementById('couponModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            activeModalCouponId = null;

            const preview = document.getElementById('couponImage');
            preview.src = '';
            preview.classList.add('hidden');

            if (currentAsset && currentAsset.isObjectUrl && currentAsset.url) {
                URL.revokeObjectURL(currentAsset.url);
            }
            currentAsset = null;
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadCoupons();
            setInterval(() => {
                if (!document.hidden) loadCoupons();
            }, 15000);
        });
    </script>
</body>
</html>
