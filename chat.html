<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>황리단길 실시간 채팅 - 오늘, 경주</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏯%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #faf8f5;
            color: #2c2522;
        }
        .font-batang {
            font-family: 'Gowun Batang', serif;
        }
        #chatBox {
            height: calc(100dvh - 235px);
            min-height: 320px;
        }
        @keyframes stickerPop {
            0% { transform: scale(0.75); opacity: 0.4; }
            70% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .sticker-pop {
            animation: stickerPop 0.25s ease-out;
        }
    </style>
</head>
<body class="bg-[#faf8f5] min-h-screen flex flex-col">

    <!-- 상단 네비게이션 -->
    <header class="bg-white/90 backdrop-blur-md border-b border-[#e8e2d8] sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="text-lg md:text-xl font-bold font-batang text-[#8c4a32]">오늘, 경주</a>
                <span class="inline-flex items-center gap-1 text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full font-bold">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="onlineCountText">1명 접속 중</span>
                </span>
                <span id="adminBadge" class="hidden text-[11px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-bold">관리자</span>
            </div>
            <div class="flex items-center gap-3 text-xs md:text-sm font-semibold">
                <a href="board.html" class="text-[#6b5b4d] hover:text-[#8c4a32]">자유게시판</a>
                <a href="index.html" class="text-[#8c4a32] hover:underline">← 메인</a>
            </div>
        </div>
    </header>

    <!-- 채팅 본문 -->
    <main class="max-w-3xl mx-auto w-full px-3 md:px-4 py-3 flex-grow flex flex-col">
        <div class="bg-[#f4ebd9]/70 border border-[#e6d5c3] rounded-xl px-3.5 py-2.5 mb-2.5 flex items-center justify-between gap-2 text-xs text-[#5c4d40]">
            <span>💬 황리단길 웨이팅, 날씨, 맛집 정보를 실시간으로 나눠보세요!</span>
            <span id="connStatus" class="shrink-0 font-bold text-emerald-700">● 연결 중</span>
        </div>

        <!-- 메시지 목록 창 -->
        <div id="chatBox" class="bg-white border border-[#e8e2d8] rounded-2xl p-4 overflow-y-auto space-y-3 shadow-xs">
            <div class="text-center text-xs text-gray-400 py-10">채팅 내역을 불러오는 중입니다...</div>
        </div>

        <!-- 카카오톡 스타일 이모티콘 서랍 (열기/닫기) -->
        <div id="emojiDrawer" class="hidden mt-2 bg-white border border-[#e6d5c3] rounded-2xl p-3 shadow-md">
            <div class="flex items-center justify-between border-b border-[#f0e7db] pb-2 mb-2.5">
                <div class="flex gap-1.5">
                    <button type="button" id="tabStickerBtn" onclick="switchEmojiTab('sticker')" class="text-xs font-bold px-3 py-1 rounded-full bg-[#8c4a32] text-white transition">
                        🏯 경주 스티커 (바로 전송)
                    </button>
                    <button type="button" id="tabMiniBtn" onclick="switchEmojiTab('mini')" class="text-xs font-semibold px-3 py-1 rounded-full bg-[#f4ebd9] text-[#6b5b4d] hover:bg-[#e6d5c3] transition">
                        😊 기본 이모지
                    </button>
                </div>
                <button type="button" onclick="toggleEmojiDrawer(false)" class="text-xs text-gray-400 hover:text-gray-700 px-2 py-0.5 font-bold">✕</button>
            </div>

            <!-- 1. 대형 스티커 그리드 -->
            <div id="stickerGrid" class="grid grid-cols-4 sm:grid-cols-6 gap-2 max-h-48 overflow-y-auto"></div>

            <!-- 2. 기본 이모지 그리드 -->
            <div id="miniEmojiGrid" class="hidden grid grid-cols-8 sm:grid-cols-10 gap-1.5 max-h-48 overflow-y-auto"></div>
        </div>

        <!-- 입력 폼 -->
        <form id="chatForm" class="mt-2.5 bg-white border border-[#e8e2d8] rounded-2xl p-2.5 shadow-sm">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-xs font-semibold text-[#7a6c5d] shrink-0 pl-1">닉네임</span>
                <input
                    type="text"
                    id="nicknameInput"
                    maxlength="12"
                    required
                    placeholder="닉네임"
                    class="w-36 md:w-44 bg-[#faf8f5] border border-[#e6d5c3] rounded-lg px-2.5 py-1 text-xs font-bold text-[#2c2522] focus:outline-none focus:border-[#8c4a32]"
                >
                <button type="button" id="randomNickBtn" class="text-[11px] text-[#8c4a32] bg-[#f4ebd9] hover:bg-[#e6d5c3] px-2 py-1 rounded-lg font-semibold transition">
                    🎲 랜덤 변경
                </button>
            </div>

            <div class="flex items-center gap-1.5">
                <button
                    type="button"
                    id="emojiToggleBtn"
                    onclick="toggleEmojiDrawer()"
                    title="이모티콘 열기"
                    class="shrink-0 w-10 h-10 rounded-xl bg-[#f4ebd9] hover:bg-[#e6d5c3] text-lg flex items-center justify-center transition"
                >
                    😊
                </button>
                <input
                    type="text"
                    id="messageInput"
                    maxlength="200"
                    required
                    autocomplete="off"
                    placeholder="메시지 입력 또는 😊 이모티콘 선택"
                    class="flex-1 bg-[#faf8f5] border border-[#e6d5c3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-[#8c4a32]"
                >
                <button
                    type="submit"
                    id="sendBtn"
                    class="shrink-0 bg-[#8c4a32] hover:bg-[#733b27] text-white font-bold px-4 py-2.5 rounded-xl text-sm transition disabled:opacity-50"
                >
                    전송
                </button>
            </div>
        </form>
    </main>

    <script>
        const SUPABASE_URL = 'https://cgwqpgmfyryegykvggyp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_7nrf_n8X346CPb-5LWZycA_P3aVc--Q';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const STICKER_PREFIX = '[STICKER]';

        // 경주 감성 대형 스티커 12종
        const GYEONGJU_STICKERS = [
            { id: 'hi', emoji: '👋', label: '반가워요!' },
            { id: 'cheom', emoji: '🏯', label: '경주 도착!' },
            { id: 'food', emoji: '🍜', label: '맛집 인정!' },
            { id: 'wait', emoji: '⏳', label: '웨이팅 중' },
            { id: 'cafe', emoji: '☕', label: '카페 힐링' },
            { id: 'photo', emoji: '📸', label: '인생샷 각' },
            { id: 'good', emoji: '👍', label: '완전 강추!' },
            { id: 'hot', emoji: '🔥', label: '지금 핫플' },
            { id: 'sun', emoji: '☀️', label: '날씨 최고' },
            { id: 'rain', emoji: '☔', label: '비 와요' },
            { id: 'night', emoji: '✨', label: '야경 예쁨' },
            { id: 'thanks', emoji: '🙏', label: '감사해요!' }
        ];

        // 입력창 삽입용 기본 이모지
        const MINI_EMOJIS = [
            '😊', '😂', '🥰', '😍', '🤩', '🥳', '😎', '🤔', '😅', '😭',
            '❤️', '🧡', '💛', '👍', '👏', '🙌', '🙏', '🔥', '✨', '🎉',
            '🍜', '🍲', '🍖', '☕', '🍰', '🍺', '🏯', '📸', '☀️', '☔'
        ];

        const renderedMessages = new Map();
        let lastSentAt = 0;
        let isAdmin = false;
        let chatChannel = null;
        let myLastReadId = 0;
        let onlinePeers = new Map();

        const esc = (s = '') =>
            String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function getDeviceId() {
            const key = 'todaygyeongju_device_id';
            let id = localStorage.getItem(key);
            if (!id) {
                id = crypto.randomUUID();
                localStorage.setItem(key, id);
            }
            return id;
        }

        function generateRandomNick() {
            const prefixes = ['황리단길산책', '첨성대별빛', '경주여행객', '대릉원나들이', '동궁과월지', '황남동미식가'];
            const pick = prefixes[Math.floor(Math.random() * prefixes.length)];
            const num = Math.floor(1000 + Math.random() * 9000);
            return `${pick}_${num}`;
        }

        function initNickname() {
            const input = document.getElementById('nicknameInput');
            const saved = localStorage.getItem('tg_chat_nickname');
            const nick = saved || generateRandomNick();
            input.value = nick;
            localStorage.setItem('tg_chat_nickname', nick);

            input.addEventListener('change', () => {
                const v = input.value.trim() || generateRandomNick();
                input.value = v;
                localStorage.setItem('tg_chat_nickname', v);
            });

            document.getElementById('randomNickBtn').addEventListener('click', () => {
                const next = generateRandomNick();
                input.value = next;
                localStorage.setItem('tg_chat_nickname', next);
            });
        }

        // 이모티콘 서랍 초기화
        function initEmojiDrawer() {
            const stickerGrid = document.getElementById('stickerGrid');
            stickerGrid.innerHTML = GYEONGJU_STICKERS.map(st => `
                <button type="button" onclick="sendSticker('${st.id}')"
                    class="flex flex-col items-center justify-center bg-[#faf8f5] hover:bg-[#f4ebd9] border border-[#ece2d4] rounded-xl py-2 px-1 transition active:scale-95">
                    <span class="text-2xl md:text-3xl leading-none mb-1">${st.emoji}</span>
                    <span class="text-[11px] font-bold text-[#5c4d40] truncate max-w-full">${esc(st.label)}</span>
                </button>
            `).join('');

            const miniGrid = document.getElementById('miniEmojiGrid');
            miniGrid.innerHTML = MINI_EMOJIS.map(em => `
                <button type="button" onclick="insertMiniEmoji('${em}')"
                    class="text-xl hover:bg-[#f4ebd9] rounded-lg py-1.5 transition active:scale-90">
                    ${em}
                </button>
            `).join('');
        }

        window.toggleEmojiDrawer = (forceState) => {
            const drawer = document.getElementById('emojiDrawer');
            const btn = document.getElementById('emojiToggleBtn');
            const shouldOpen = typeof forceState === 'boolean' ? forceState : drawer.classList.contains('hidden');
            drawer.classList.toggle('hidden', !shouldOpen);
            btn.classList.toggle('bg-[#8c4a32]', shouldOpen);
            btn.classList.toggle('text-white', shouldOpen);
            btn.classList.toggle('bg-[#f4ebd9]', !shouldOpen);
        };

        window.switchEmojiTab = (tab) => {
            const isSticker = tab === 'sticker';
            document.getElementById('stickerGrid').classList.toggle('hidden', !isSticker);
            document.getElementById('miniEmojiGrid').classList.toggle('hidden', isSticker);

            document.getElementById('tabStickerBtn').className = isSticker
                ? 'text-xs font-bold px-3 py-1 rounded-full bg-[#8c4a32] text-white transition'
                : 'text-xs font-semibold px-3 py-1 rounded-full bg-[#f4ebd9] text-[#6b5b4d] hover:bg-[#e6d5c3] transition';

            document.getElementById('tabMiniBtn').className = !isSticker
                ? 'text-xs font-bold px-3 py-1 rounded-full bg-[#8c4a32] text-white transition'
                : 'text-xs font-semibold px-3 py-1 rounded-full bg-[#f4ebd9] text-[#6b5b4d] hover:bg-[#e6d5c3] transition';
        };

        window.insertMiniEmoji = (emoji) => {
            const input = document.getElementById('messageInput');
            const start = input.selectionStart ?? input.value.length;
            const end = input.selectionEnd ?? input.value.length;
            input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
            input.focus();
            const pos = start + emoji.length;
            input.setSelectionRange(pos, pos);
        };

        window.sendSticker = async (stickerId) => {
            const st = GYEONGJU_STICKERS.find(s => s.id === stickerId);
            if (!st) return;
            toggleEmojiDrawer(false);
            await postMessageToDb(`${STICKER_PREFIX}${st.id}`);
        };

        function parseSticker(messageText) {
            if (!messageText || !messageText.startsWith(STICKER_PREFIX)) return null;
            const id = messageText.slice(STICKER_PREFIX.length).trim();
            return GYEONGJU_STICKERS.find(s => s.id === id) || null;
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function getReadCount(msg) {
            let count = 0;
            onlinePeers.forEach((info, peerDeviceId) => {
                if (peerDeviceId === msg.device_id) return;
                if ((info.last_read_id || 0) >= msg.id) {
                    count += 1;
                }
            });
            return count;
        }

        function refreshAllReadIndicators() {
            renderedMessages.forEach((msg, id) => {
                const badge = document.getElementById(`read-${id}`);
                if (!badge) return;
                const cnt = getReadCount(msg);
                badge.textContent = cnt > 0 ? `${cnt}명 읽음` : '';
            });
        }

        async function syncMyPresence() {
            if (!chatChannel) return;
            try {
                await chatChannel.track({
                    device_id: getDeviceId(),
                    last_read_id: document.hidden ? myLastReadId : getMaxMessageId(),
                    updated_at: Date.now()
                });
            } catch (e) {
                console.error('Presence sync error:', e);
            }
        }

        function getMaxMessageId() {
            let maxId = myLastReadId;
            renderedMessages.forEach((_, id) => {
                if (id > maxId) maxId = id;
            });
            return maxId;
        }

        function markAsReadIfVisible() {
            if (document.hidden) return;
            const latest = getMaxMessageId();
            if (latest > myLastReadId) {
                myLastReadId = latest;
                syncMyPresence();
            }
        }

        window.deleteChatMessage = async (id) => {
            if (!isAdmin) return;
            if (!confirm('이 채팅 메시지를 삭제할까요?')) return;
            const { error } = await sb.from('chat_messages').delete().eq('id', id);
            if (error) {
                alert('삭제 실패: ' + error.message);
                return;
            }
            const el = document.getElementById(`msg-${id}`);
            if (el) el.remove();
            renderedMessages.delete(id);
        };

        function appendMessage(msg, autoScroll = true) {
            if (!msg || renderedMessages.has(msg.id)) return;
            const wasEmpty = renderedMessages.size === 0;
            renderedMessages.set(msg.id, msg);

            const box = document.getElementById('chatBox');
            if (wasEmpty) {
                box.innerHTML = '';
            }

            const isMine = msg.device_id === getDeviceId();
            const row = document.createElement('div');
            row.id = `msg-${msg.id}`;
            row.className = `flex flex-col ${isMine ? 'items-end' : 'items-start'}`;

            const adminDelBtn = isAdmin
                ? `<button type="button" onclick="deleteChatMessage(${msg.id})" class="text-[10px] text-rose-600 hover:underline font-bold shrink-0">삭제</button>`
                : '';

            const initialRead = getReadCount(msg);
            const readText = initialRead > 0 ? `${initialRead}명 읽음` : '';
            const sticker = parseSticker(msg.message);

            const bubbleHtml = sticker
                ? `
                    <div class="sticker-pop bg-[#fdf8f1] border-2 border-[#e6d5c3] rounded-2xl px-4 py-2.5 flex flex-col items-center shadow-xs select-none">
                        <span class="text-5xl leading-none mb-1.5">${sticker.emoji}</span>
                        <span class="text-xs font-bold text-[#8c4a32] bg-[#f4ebd9] px-2.5 py-0.5 rounded-full">${esc(sticker.label)}</span>
                    </div>
                `
                : (isMine
                    ? `<div class="bg-[#8c4a32] text-white rounded-2xl rounded-tr-sm px-3.5 py-2 text-sm leading-relaxed break-words shadow-xs">${esc(msg.message)}</div>`
                    : `<div class="bg-[#f6f1ea] text-[#2c2522] border border-[#e6d5c3] rounded-2xl rounded-tl-sm px-3.5 py-2 text-sm leading-relaxed break-words">${esc(msg.message)}</div>`);

            row.innerHTML = isMine
                ? `
                    <div class="flex items-end gap-1.5 max-w-[82%]">
                        ${adminDelBtn}
                        <div class="flex flex-col items-end shrink-0 leading-tight">
                            <span id="read-${msg.id}" class="text-[10px] font-bold text-[#8c4a32]">${readText}</span>
                            <span class="text-[10px] text-gray-400">${formatTime(msg.created_at)}</span>
                        </div>
                        ${bubbleHtml}
                    </div>
                `
                : `
                    <span class="text-[11px] font-bold text-[#6b5b4d] mb-1 px-1">${esc(msg.nickname)}</span>
                    <div class="flex items-end gap-1.5 max-w-[82%]">
                        ${bubbleHtml}
                        <div class="flex flex-col items-start shrink-0 leading-tight">
                            <span id="read-${msg.id}" class="text-[10px] font-bold text-[#8c4a32]">${readText}</span>
                            <span class="text-[10px] text-gray-400">${formatTime(msg.created_at)}</span>
                        </div>
                        ${adminDelBtn}
                    </div>
                `;

            box.appendChild(row);
            if (autoScroll) {
                box.scrollTop = box.scrollHeight;
            }
            markAsReadIfVisible();
        }

        async function loadRecentMessages() {
            const box = document.getElementById('chatBox');
            const { data, error } = await sb
                .from('chat_messages')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(60);

            if (error) {
                box.innerHTML = '<div class="text-center text-xs text-rose-500 py-10">채팅을 불러오지 못했습니다.</div>';
                return;
            }

            if (!data || data.length === 0) {
                box.innerHTML = '<div class="text-center text-xs text-gray-400 py-10">아직 대화가 없습니다. 첫 인사를 남겨보세요! 👋</div>';
                return;
            }

            data.reverse().forEach(m => appendMessage(m, false));
            box.scrollTop = box.scrollHeight;
            myLastReadId = getMaxMessageId();
        }

        function subscribeRealtime() {
            const statusEl = document.getElementById('connStatus');
            const onlineTextEl = document.getElementById('onlineCountText');

            chatChannel = sb.channel('todaygyeongju_live_chat', {
                config: {
                    presence: { key: getDeviceId() }
                }
            });

            chatChannel
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'chat_messages' },
                    (payload) => appendMessage(payload.new, true)
                )
                .on(
                    'postgres_changes',
                    { event: 'DELETE', schema: 'public', table: 'chat_messages' },
                    (payload) => {
                        const el = document.getElementById(`msg-${payload.old.id}`);
                        if (el) el.remove();
                        renderedMessages.delete(payload.old.id);
                    }
                )
                .on('presence', { event: 'sync' }, () => {
                    const state = chatChannel.presenceState();
                    const nextPeers = new Map();

                    Object.entries(state).forEach(([key, presences]) => {
                        if (!Array.isArray(presences) || presences.length === 0) return;
                        const latest = presences[presences.length - 1];
                        const devId = latest.device_id || key;
                        nextPeers.set(devId, {
                            last_read_id: Number(latest.last_read_id || 0)
                        });
                    });

                    onlinePeers = nextPeers;
                    const count = Math.max(1, onlinePeers.size);
                    onlineTextEl.textContent = `${count}명 접속 중`;
                    refreshAllReadIndicators();
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        statusEl.textContent = '● 실시간 연결됨';
                        statusEl.className = 'shrink-0 font-bold text-emerald-700';
                        await syncMyPresence();
                    } else {
                        statusEl.textContent = '● 연결 확인 중';
                        statusEl.className = 'shrink-0 font-bold text-amber-700';
                    }
                });
        }

        async function postMessageToDb(messageText) {
            const now = Date.now();
            if (now - lastSentAt < 1500) {
                alert('메시지와 이모티콘은 1.5초 간격으로 보낼 수 있습니다.');
                return false;
            }

            const nickInput = document.getElementById('nicknameInput');
            const sendBtn = document.getElementById('sendBtn');
            const nickname = (nickInput.value.trim() || generateRandomNick()).slice(0, 12);

            localStorage.setItem('tg_chat_nickname', nickname);
            sendBtn.disabled = true;

            try {
                const { data, error } = await sb
                    .from('chat_messages')
                    .insert([{ nickname, message: messageText, device_id: getDeviceId() }])
                    .select()
                    .single();

                if (error) throw error;

                lastSentAt = Date.now();
                if (data) appendMessage(data, true);
                return true;
            } catch (err) {
                console.error(err);
                alert('전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');
                return false;
            } finally {
                sendBtn.disabled = false;
            }
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgInput = document.getElementById('messageInput');
            const message = msgInput.value.trim();
            if (!message) return;

            const ok = await postMessageToDb(message);
            if (ok) {
                msgInput.value = '';
                toggleEmojiDrawer(false);
                msgInput.focus();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                markAsReadIfVisible();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (chatChannel) chatChannel.untrack();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await sb.auth.getSession();
            isAdmin = !!session;
            if (isAdmin) {
                document.getElementById('adminBadge').classList.remove('hidden');
            }

            initNickname();
            initEmojiDrawer();
            await loadRecentMessages();
            subscribeRealtime();
        });
    </script>
</body>
</html>
